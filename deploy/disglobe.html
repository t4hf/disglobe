<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Disglobe</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🌐</text></svg>">
<style>
  :root {
    /* galaxy palette */
    --rail: #0B0914;
    --sidebar: rgba(18, 14, 33, 0.85);
    --members: rgba(18, 14, 33, 0.85);
    --chat: #0D0B21;
    --chat-grad: linear-gradient(165deg, #0D0B21 0%, #120C26 55%, #170F2C 100%);
    --accent: #9D4EDD;
    --accent-2: #00F5D4;
    --accent-dim: rgba(157, 78, 221, .16);
    --accent-2-dim: rgba(0, 245, 212, .12);
    --glow: rgba(157, 78, 221, .55);
    --glow-soft: rgba(157, 78, 221, .30);
    --panel-blur: 10px;
    --card: #241a3d;
    --card-2: #2c2049;
    --hover: rgba(255,255,255,.05);
    --active: rgba(157, 78, 221, .14);
    --border: #35275a;
    --text: #e6e1f2;
    --muted: #a89fc0;
    --faint: #7d7495;
    --danger: #f23f43;
    --warn: #f0b232;
    --ping: #f23f43;
    --green: #3ba55c;
    --yellow: #faa61a;
    --radius: 8px;
    --online: #3ba55c;
    --idle: #faa61a;
    --dnd: #ed4245;
    --offline: #747f8d;
  }
  body { background-color: #0B0914; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    background: var(--chat-grad, var(--chat));
    color: var(--text);
    font-family: Georgia, "Times New Roman", "Palatino Linotype", serif;
    font-size: 15px;
    overflow: hidden;
    user-select: none;
  }
  button { font: inherit; color: inherit; background: none; border: none; cursor: pointer; }
  ::-webkit-scrollbar { width: 8px; height: 8px; }
  ::-webkit-scrollbar-thumb { background: #2c2049; border-radius: 4px; }
  ::-webkit-scrollbar-track { background: transparent; }

  #app { display: flex; height: calc(100vh - 28px); }
  body { background-color: #0B0914; }
  /* ---------------- titlebar ---------------- */
  #titlebar {
    height: 28px; display: flex; align-items: center; background: #080610;
    padding: 0 8px; gap: 8px; -webkit-app-region: drag; user-select: none;
    position: relative; z-index: 1;
  }
  .tb-left { flex: 1; }
  .tb-title { font-size: 12.5px; font-weight: 700; color: var(--text); opacity: .9; }
  .tb-right { flex: 1; display: flex; align-items: center; justify-content: flex-end; gap: 6px; -webkit-app-region: no-drag; }
  #tbClock { font-size: 11.5px; color: var(--muted); font-variant-numeric: tabular-nums; margin-right: 6px; }
  .tb-btn { font-size: 12px; opacity: .75; padding: 2px 5px; border-radius: 4px; }
  .tb-btn:hover { opacity: 1; background: var(--hover); }
  /* galaxy starfield canvas behind the app columns (see #starfield <canvas> + JS below) */
  #starfield {
    position: fixed; inset: 0; width: 100vw; height: 100vh; z-index: 0; pointer-events: none;
    background: var(--chat-grad, #0D0B21);
  }
  @media (prefers-reduced-motion: reduce) { #starfield { display: none; } }
  #app, #settingsPage { position: relative; }
  /* soft nebula haze drifting over the starfield, cheap pure-CSS layer */
  #app::before {
    content: ""; position: absolute; inset: 0; pointer-events: none; z-index: 0;
    background:
      radial-gradient(1200px 700px at 75% -10%, rgba(157, 78, 221, .13), transparent 65%),
      radial-gradient(900px 600px at 12% 110%, rgba(0, 245, 212, .05), transparent 65%),
      radial-gradient(1000px 800px at 40% 40%, rgba(88, 40, 180, .10), transparent 70%);
    animation: nebulaDrift 60s ease-in-out infinite alternate;
  }
  @keyframes nebulaDrift {
    0%   { opacity: .8; transform: translate3d(0, 0, 0) scale(1); }
    100% { opacity: 1;  transform: translate3d(-3%, 2%, 0) scale(1.06); }
  }
  @media (prefers-reduced-motion: reduce) { #app::before { animation: none; } }
  #app > * { position: relative; z-index: 1; }

  /* ---------------- server rail ---------------- */
  #rail {
    width: 72px; flex: none; background: var(--rail);
    display: flex; flex-direction: column; align-items: center;
    padding: 12px 0; gap: 8px; overflow-y: auto; overflow-x: visible;
    box-shadow: 2px 0 24px rgba(0,0,0,.45);
  }
  #rail::-webkit-scrollbar { width: 0; }
  .rail-item {
    position: relative; width: 48px; height: 48px; border-radius: 50%; flex: none;
    display: grid; place-items: center; font-size: 22px;
    background: var(--card); transition: border-radius .18s ease, background .18s ease;
    cursor: pointer;
  }
  .rail-item:hover { border-radius: 16px; background: var(--accent); color: #ffffff; }
  .rail-item.active { border-radius: 16px; box-shadow: 0 0 0 1.5px rgba(157,78,221,.55), 0 0 12px 2px var(--glow-soft), 0 0 28px 4px rgba(157,78,221,.18); }
  .rail-item.active.home { background: var(--accent-dim); color: var(--accent); box-shadow: 0 0 0 1.5px rgba(157,78,221,.45), 0 0 14px 3px var(--glow-soft); }
  .rail-item.home { background: var(--card); }
  .rail-item.home svg { width: 28px; height: 28px; }
  .rail-pill {
    position: absolute; left: -14px; width: 4px; border-radius: 0 4px 4px 0;
    background: var(--text); transition: height .18s ease, opacity .18s ease;
    height: 8px; opacity: 0; pointer-events: none;
  }
  .rail-item:hover .rail-pill, .rail-item.unread .rail-pill { height: 20px; opacity: 1; }
  .rail-item.active .rail-pill { height: 36px; background: var(--accent); box-shadow: 0 0 10px 2px var(--glow-soft); }
  .rail-sep { width: 32px; height: 2px; background: var(--border); border-radius: 1px; flex: none; }
  .rail-item.add { color: var(--accent); background: var(--card); }
  .rail-item.add:hover { color: #ffffff; }

  [data-tip] { position: relative; }
  [data-tip]:hover::after {
    content: attr(data-tip); position: absolute; left: calc(100% + 14px); top: 50%;
    transform: translateY(-50%); background: #111214; color: var(--text);
    padding: 8px 12px; border-radius: 8px; font-size: 14px; font-weight: 600;
    white-space: nowrap; z-index: 300; pointer-events: none;
    box-shadow: 0 6px 20px rgba(0,0,0,.5);
  }

  /* ---------------- sidebar ---------------- */
  #sidebar { width: 252px; flex: none; background: var(--sidebar); backdrop-filter: blur(var(--panel-blur)) saturate(1.2); -webkit-backdrop-filter: blur(var(--panel-blur)) saturate(1.2); display: flex; flex-direction: column; min-height: 0; }
  #serverHeader {
    height: 48px; flex: none; display: flex; align-items: center; padding: 0 14px;
    font-weight: 700; font-size: 15px; border-bottom: 1px solid #00000055;
    cursor: pointer; transition: background .12s;
  }
  #serverHeader:hover { background: var(--hover); }
  #serverHeader .chev { margin-left: auto; color: var(--muted); font-size: 11px; }
  #channelList { flex: 1; overflow-y: auto; padding: 8px 8px 16px; min-height: 0; }
  .cat {
    display: flex; align-items: center; padding: 16px 8px 4px; cursor: pointer;
    color: var(--muted); font-size: 11.5px; font-weight: 700; letter-spacing: .04em; text-transform: uppercase;
  }
  .cat:hover { color: var(--text); }
  .cat .chev { font-size: 10px; margin-right: 3px; transition: transform .15s; }
  .cat.closed .chev { transform: rotate(-90deg); }
  .cat .cat-add { margin-left: auto; font-size: 15px; opacity: 0; }
  .cat:hover .cat-add { opacity: .8; }
  .chan {
    display: flex; align-items: center; gap: 7px; padding: 6px 8px; margin: 1px 0;
    border-radius: 6px; cursor: pointer; color: var(--muted); font-weight: 500; font-size: 15px;
  }
  .chan:hover { background: var(--hover); color: var(--text); }
  .chan.active { background: var(--active); color: var(--text); }
  .chan.unread { color: var(--text); font-weight: 700; }
  .chan .hash { color: var(--faint); flex: none; width: 20px; height: 20px; }
  .chan .hash svg { width: 100%; height: 100%; }
  .chan .chan-dot { margin-left: auto; width: 8px; height: 8px; border-radius: 50%; background: var(--text); flex: none; }
  .chan .nunread {
    background: #9d6bff; color: #fff; font-size: 10px; font-weight: 800; border-radius: 999px;
    padding: 1px 6px; margin-left: auto; letter-spacing: .04em; flex: none;
  }
  .cat .nunread {
    background: #9d6bff; color: #fff; font-size: 10px; font-weight: 800; border-radius: 999px;
    padding: 1px 6px; letter-spacing: .04em; flex: none;
  }
  .cat .cat-add { margin-left: auto; }
  .cat .cat-add + .nunread { margin-left: 4px; }
  .chan.connected { color: #23a55a; }
  .chan .vcount { margin-left: auto; font-size: 12px; color: var(--muted); }
  .voice-members { padding: 0 8px 6px 30px; display: flex; flex-direction: column; gap: 4px; }
  #voiceMembersLive { padding: 6px 8px 8px; display: flex; flex-direction: column; gap: 6px; }
  #voiceMembersLive .vrow { display: flex; align-items: center; gap: 8px; }
  #voiceMembersLive video { width: 100%; border-radius: 8px; background: #000; max-height: 120px; }
  #voiceMembersLive .cb-btn.watch { flex: none; width: 30px; height: 30px; font-size: 12px; }

  #voicePanel { margin: 0 8px 8px; background: var(--card); border-radius: var(--radius); padding: 10px 12px; display: none; }
  #voicePanel.show { display: block; }
  #voicePanel .vp-row { display: flex; align-items: center; gap: 10px; }
  #voicePanel .vp-info { flex: 1; min-width: 0; }
  #voicePanel .vp-chan { color: #23a55a; font-weight: 700; font-size: 13.5px; }
  #voicePanel .vp-signal { color: var(--muted); font-size: 11.5px; }
  #voicePanel .vp-disc { color: var(--muted); font-size: 12px; font-weight: 600; padding: 4px 8px; border-radius: 5px; }
  #voicePanel .vp-disc:hover { color: var(--danger); background: var(--hover); }

  /* ---- call bar (Discord-style action row under the voice panel) ---- */
  #callBar { display: flex; gap: 6px; margin: 8px 8px 6px; }
  #callBar .cb-btn { flex: 1; height: 34px; border-radius: 7px; background: var(--hover, #2b2d31); color: var(--text, #dbdee1); display: grid; place-items: center; font-size: 16px; cursor: pointer; transition: background .12s, color .12s; }
  #callBar .cb-btn:hover { background: #404249; color: #fff; }
  #callBar .cb-btn.on { background: var(--accent); color: #fff; }
  #callBar .cb-btn.danger-on { background: #da373c; color: #fff; }
  #callBar .cb-btn.sharing { background: #23a55a; color: #fff; }
  #callBar .cb-btn.cam-on { background: #23a55a; color: #fff; }
  #callBar .cb-sep { width: 1px; background: var(--border); margin: 3px 2px; }
  #callBar .cb-btn svg { width: 17px; height: 17px; }

  /* ---- stream viewer overlay ---- */
  #streamView { position: fixed; inset: 0; background: #000; z-index: 220; display: none; flex-direction: column; }
  #streamView.show { display: flex; }
  #streamView video { flex: 1; min-height: 0; object-fit: contain; background: #000; }
  #streamBar { display: flex; align-items: center; gap: 10px; padding: 8px 14px; background: #1e1f22; color: #dbdee1; font-size: 13px; }
  #streamBar .sv-name { font-weight: 700; color: #23a55a; }
  #streamBar .sv-stats { color: #949ba4; font-size: 12px; }
  #streamBar select { background: #1e1f22; color: #dbdee1; border: 1px solid #4e5058; border-radius: 6px; padding: 4px 8px; font-size: 12.5px; }
  #streamBar .sv-btn { background: #4e5058; color: #fff; border-radius: 6px; padding: 5px 12px; font-weight: 600; font-size: 12.5px; }
  #streamBar .sv-btn:hover { background: #6d6f78; }
  #streamBar .sv-btn.stop { background: #da373c; }
  #streamBar .sv-live { color: #f0b232; font-size: 11px; font-weight: 800; letter-spacing: .5px; }

  /* ---- report message flow ---- */
  .ctx-menu { position: fixed; z-index: 240; background: #232428; border: 1px solid #3f4147; border-radius: 8px; padding: 6px; min-width: 190px; box-shadow: 0 8px 24px rgba(0,0,0,.5); }
  .ctx-menu button { display: block; width: 100%; text-align: left; padding: 7px 10px; border-radius: 5px; color: #b5bac1; font-size: 13.5px; }
  .ctx-menu button:hover { background: var(--accent); color: #fff; }
  .ctx-menu button.danger { color: #f23f43; }
  .ctx-menu button.danger:hover { background: #f23f43; color: #fff; }
  .ctx-sep { height: 1px; background: #3f4147; margin: 5px 4px; }
  #reportReasons .rr { display: block; width: 100%; text-align: left; padding: 10px 12px; border-radius: 8px; background: var(--hover, #2b2d31); margin-bottom: 8px; color: var(--text); font-size: 14px; }
  #reportReasons .rr:hover { background: #404249; }
  #reportReasons .rr b { display: block; }
  #reportReasons .rr span { display: block; color: var(--muted); font-size: 12px; margin-top: 2px; }

  #userPanel {
    height: 56px; flex: none; background: var(--card-2); display: flex; align-items: center;
    padding: 0 8px; gap: 6px;
  }
  #meChip { display: flex; align-items: center; gap: 9px; flex: 1; min-width: 0; padding: 4px 6px; border-radius: 6px; cursor: pointer; }
  #meChip:hover { background: var(--hover); }
  #meChip .me-name { font-size: 13.5px; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #meChip .me-status { font-size: 11.5px; color: var(--muted); }
  .pbtn { width: 32px; height: 32px; border-radius: 6px; display: grid; place-items: center; color: var(--muted); flex: none; }
  .pbtn:hover { background: var(--hover); color: var(--text); }
  .pbtn svg { width: 19px; height: 19px; }
  .pbtn.off { color: var(--danger); }

  /* ---------------- avatars ---------------- */
  .av {
    width: 40px; height: 40px; border-radius: 50%; flex: none; position: relative;
    display: grid; place-items: center; font-weight: 700; font-size: 16px; color: #ffffff;
  }
  .av.lg .st { width: 20px; height: 20px; border-width: 5px; }
  .av.sm { width: 32px; height: 32px; font-size: 13px; }
  .av.lg { width: 72px; height: 72px; font-size: 26px; }
  .av .st {
    position: absolute; bottom: -2px; right: -2px; width: 14px; height: 14px; border-radius: 50%;
    border: 3.5px solid var(--chat); background: var(--muted);
  }
  .av.sm .st { width: 12px; height: 12px; border-width: 3px; }
  .st.online { background: var(--accent); }
  .st.idle { background: var(--warn); }
  .st.dnd { background: var(--ping); }
  .st.offline { background: var(--faint); }
  .mini-av { width: 24px; height: 24px; border-radius: 50%; display: grid; place-items: center; font-size: 10px; font-weight: 700; color: #ffffff; overflow: hidden; }
  .mini-av img { width: 100%; height: 100%; object-fit: cover; border-radius: 50%; }
  .av .av-img { width: 100%; height: 100%; object-fit: cover; border-radius: 50%; position: absolute; inset: 0; }

  /* profile card */
  #profileCard { position: fixed; display: none; width: 300px; background: var(--rail); border-radius: 14px; z-index: 420; box-shadow: 0 18px 60px rgba(0,0,0,.7); overflow: hidden; border: 1px solid var(--border); }
  #profileCard.show { display: block; }
  #profileCard .pc-menu { border-top: 1px solid var(--border); margin-top: 12px; padding: 8px; display: flex; flex-direction: column; gap: 1px; }
  #profileCard .pc-menu button { display: flex; align-items: center; gap: 10px; padding: 8px 10px; border-radius: 6px; font-size: 13.5px; font-weight: 600; color: var(--text); text-align: left; }
  #profileCard .pc-menu button:hover { background: var(--hover); }
  #profileCard .pc-menu button .chev { margin-left: auto; color: var(--muted); font-size: 11px; }
  .pc-banner { height: 92px; background-size: cover; background-position: center; }
  .pc-body { padding: 0 14px 14px; }
  .pc-av { display: inline-block; margin-top: -40px; position: relative; }
  .pc-av .av { border: 6px solid var(--rail); border-radius: 50%; }
  .pc-av .av .st { border-color: var(--rail); }
  .pc-name { font-size: 19px; font-weight: 800; margin-top: 8px; letter-spacing: -.01em; }
  .pc-handle { font-size: 13px; color: var(--muted); }
  .pc-status { font-size: 13.5px; margin-top: 8px; }
  .pc-pronouns { font-size: 12.5px; color: var(--muted); margin-top: 2px; }
  .pc-bio { font-size: 13.5px; color: #d5d9e4; margin-top: 8px; white-space: pre-wrap; line-height: 1.5; }
  .pc-strip { margin-top: 12px; border-top: 1px solid var(--border); padding-top: 9px; font-size: 12px; color: var(--muted); display: flex; justify-content: space-between; }
  .pc-strip b { color: var(--text); }
  .pc-edit { width: 100%; margin-top: 12px; }

  /* settings previews */
  .set-banner { height: 90px; border-radius: 10px; background-size: cover; background-position: center; border: 1px solid var(--border); }
  .set-av { width: 72px; height: 72px; border-radius: 50%; overflow: hidden; display: grid; place-items: center; background: var(--rail); flex: none; border: 1px solid var(--border); font-weight: 800; font-size: 24px; }
  .set-av img { width: 100%; height: 100%; object-fit: cover; }
  .set-row { display: flex; gap: 8px; align-items: center; margin-top: 8px; flex-wrap: wrap; }

  /* ---------------- main ---------------- */
  #main { flex: 1; display: flex; flex-direction: column; min-width: 0; background: transparent; }
  /* panels sit above the starfield, so the chat column shows the gradient through */
  #mainHeader {
    height: 48px; flex: none; display: flex; align-items: center; gap: 10px; padding: 0 16px;
    border-bottom: 1px solid #00000055; box-shadow: 0 1px 0 rgba(0,0,0,.1);
  }
  #mainHeader .h-icon { color: var(--faint); width: 24px; height: 24px; flex: none; }
  #mainHeader .h-icon svg { width: 100%; height: 100%; }
  #mainHeader h2 { font-size: 16px; font-weight: 700; white-space: nowrap; }
  #topic { color: var(--muted); font-size: 13.5px; border-left: 1px solid var(--border); padding-left: 10px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 340px; }
  #mainHeader .hbtns { margin-left: auto; display: flex; align-items: center; gap: 4px; }
  .hbtn { width: 32px; height: 32px; border-radius: 6px; display: grid; place-items: center; color: var(--muted); }
  .hbtn:hover { color: var(--text); background: var(--hover); }
  .hbtn svg { width: 20px; height: 20px; }
  #searchBox input {
    background: var(--rail); border: 1px solid transparent; color: var(--text);
    border-radius: 6px; padding: 5px 8px; font: inherit; font-size: 13.5px; width: 170px;
    outline: none; transition: width .15s, border-color .15s;
  }
  #searchBox input:focus { width: 230px; border-color: var(--border); }
  #searchBox input::placeholder { color: var(--faint); }

  #searchResults {
    display: none; position: absolute; top: 52px; right: 12px; width: 420px; max-height: 420px;
    overflow-y: auto; background: var(--rail); border-radius: 10px; z-index: 120;
    box-shadow: 0 12px 40px rgba(0,0,0,.6); padding: 8px;
  }
  #searchResults.show { display: block; }
  #searchResults .sr-head { color: var(--muted); font-size: 12px; font-weight: 700; text-transform: uppercase; padding: 6px 8px; }
  .sr-item { padding: 8px 10px; border-radius: 8px; cursor: pointer; }
  .sr-item:hover { background: var(--hover); }
  .sr-item .sr-from { font-size: 12.5px; font-weight: 700; margin-bottom: 2px; }
  .sr-item .sr-text { font-size: 13.5px; color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .sr-item mark { background: rgba(88,101,242,.35); color: var(--text); border-radius: 3px; }

  #chatScroll { flex: 1; overflow-y: auto; min-height: 0; }
  #messages { padding: 16px 0 24px; }

  .chan-intro { padding: 8px 16px 4px; border-bottom: 1px solid #ffffff0d; margin-bottom: 16px; }
  .chan-intro .big-hash { width: 68px; height: 68px; color: var(--text); opacity: .9; margin-bottom: 8px; display: block; }
  .chan-intro .big-hash svg { width: 100%; height: 100%; }
  .chan-intro h1 { font-size: 30px; letter-spacing: -.02em; }
  .chan-intro p { color: var(--muted); margin-top: 4px; font-size: 14.5px; }
  .chan-intro p b { color: var(--text); }

  .day-divider { display: flex; align-items: center; gap: 8px; margin: 18px 16px 8px; color: var(--muted); font-size: 12px; font-weight: 700; }
  .day-divider::before, .day-divider::after { content: ""; flex: 1; height: 1px; background: #ffffff14; }

  /* theme variants */
  body.theme-light {
    --rail: #e3e5e8; --sidebar: #f2f3f5; --chat: #ffffff; --members: #f2f3f5;
    --chat-grad: linear-gradient(180deg, #ffffff, #f2f3f5);
    --card: #ebedef; --card-2: #e3e5e8; --hover: rgba(0,0,0,.04); --active: rgba(0,0,0,.08);
    --border: #d4d7dc; --text: #2e3338; --muted: #6d6f78; --faint: #9a9ca3;
    --accent: #5865f2;
  }
  body.theme-light #starfield { display: none; }
  body.theme-midnight {
    --rail: #0a0a12; --sidebar: #0e0e1a; --chat: #12121f; --members: #0e0e1a;
    --chat-grad: linear-gradient(165deg, #0a0a12, #12121f);
    --card: #1a1a2e; --card-2: #20203a; --border: #262640;
    --text: #e4e1f0; --muted: #8f8ba8; --faint: #615d7a;
    --accent: #7c5cff;
    --glow: rgba(124,92,255,.55); --glow-soft: rgba(124,92,255,.30);
  }
  body.font-sans { font-family: "gg sans", "Noto Sans", "Segoe UI", system-ui, sans-serif; }
  body.font-serif { font-family: Georgia, "Times New Roman", "Palatino Linotype", serif; }
  body.font-mono { font-family: ui-monospace, Consolas, "Cascadia Code", monospace; }

  /* display-name effects & profile effects */
  .fx-glow-gold { animation: fxGold 2s ease-in-out infinite; }
  @keyframes fxGold { 0%,100% { text-shadow: 0 0 6px rgba(250,204,21,.6), 0 0 14px rgba(250,204,21,.3); } 50% { text-shadow: 0 0 14px rgba(250,204,21,.95), 0 0 28px rgba(250,170,26,.6); } }
  .fx-glow-neon { animation: fxNeon 1.8s ease-in-out infinite; }
  @keyframes fxNeon { 0%,100% { text-shadow: 0 0 6px rgba(0,247,255,.7), 0 0 16px rgba(157,107,255,.4); } 50% { text-shadow: 0 0 16px rgba(0,247,255,1), 0 0 32px rgba(157,107,255,.7); } }
  .fx-rainbow { background: linear-gradient(90deg,#ff5f6d,#ffc371,#47ffb1,#5fa8ff,#c56bff,#ff5f6d); background-size: 300% 100%; -webkit-background-clip: text; background-clip: text; color: transparent !important; animation: fxRainbow 4s linear infinite; }
  @keyframes fxRainbow { to { background-position: 300% 0; } }
  .fx-fire { animation: fxFire 1.6s ease-in-out infinite; }
  @keyframes fxFire { 0%,100% { text-shadow: 0 0 8px rgba(255,80,0,.7), 0 2px 10px rgba(255,180,0,.5); } 50% { text-shadow: 0 0 16px rgba(255,120,0,.95), 0 0 26px rgba(255,60,0,.6); } }
  .profile-fx-sparkle { position: relative; overflow: hidden; }
  .profile-fx-sparkle::after { content: ""; position: absolute; inset: 0; pointer-events: none; z-index: 3; border-radius: 14px; background-image: radial-gradient(2px 2px at 20% 30%, rgba(255,255,255,.95), transparent), radial-gradient(1.5px 1.5px at 70% 60%, rgba(255,255,255,.8), transparent), radial-gradient(2px 2px at 40% 80%, rgba(255,255,255,.9), transparent), radial-gradient(1.5px 1.5px at 85% 25%, rgba(255,255,255,.7), transparent), radial-gradient(2px 2px at 55% 45%, rgba(255,240,150,.8), transparent); animation: sparkles 2.4s ease-in-out infinite; }
  @keyframes sparkles { 0%,100% { opacity: .35; } 50% { opacity: 1; } }
  .profile-fx-confetti { position: relative; overflow: hidden; }
  .profile-fx-confetti::after { content: ""; position: absolute; inset: 0; pointer-events: none; z-index: 3; border-radius: 14px; background-image: radial-gradient(3px 3px at 15% 40%, #ff5f6d, transparent), radial-gradient(3px 3px at 45% 70%, #47ffb1, transparent), radial-gradient(3px 3px at 75% 35%, #5fa8ff, transparent), radial-gradient(3px 3px at 30% 20%, #ffc371, transparent), radial-gradient(3px 3px at 90% 65%, #c56bff, transparent); animation: confettiFall 2.4s linear infinite; }
  @keyframes confettiFall { from { background-position: 0 -40px; } to { background-position: 0 60px; } }
  .profile-fx-aurora { position: relative; overflow: hidden; }
  .profile-fx-aurora::after { content: ""; position: absolute; inset: 0; pointer-events: none; z-index: 3; border-radius: 14px; background: linear-gradient(120deg, rgba(124,92,255,.4), rgba(0,247,255,.3), rgba(71,255,177,.35), rgba(124,92,255,.4)); background-size: 300% 100%; mix-blend-mode: screen; animation: auroraFlow 6s ease-in-out infinite; }
  @keyframes auroraFlow { 0%,100% { background-position: 0% 50%; } 50% { background-position: 100% 50%; } }
  .profile-fx-hearts { position: relative; overflow: hidden; }
  .profile-fx-hearts::after { content: ""; position: absolute; inset: 0; pointer-events: none; z-index: 3; border-radius: 14px; background-image: radial-gradient(circle at 20% 85%, #ff5f6d 3px, transparent 4px), radial-gradient(circle at 60% 90%, #ff8fab 2.5px, transparent 3.5px), radial-gradient(circle at 85% 80%, #ff2e88 3px, transparent 4px), radial-gradient(circle at 40% 95%, #ffb3c6 2px, transparent 3px); animation: heartsFloat 3s ease-in-out infinite; }
  @keyframes heartsFloat { 0% { transform: translateY(6px); opacity: .4; } 50% { opacity: 1; } 100% { transform: translateY(-10px); opacity: .4; } }
  .profile-fx-stars { position: relative; overflow: hidden; }
  .profile-fx-stars::after { content: ""; position: absolute; inset: 0; pointer-events: none; z-index: 3; border-radius: 14px; background-image: radial-gradient(1.5px 1.5px at 10% 20%, #fff, transparent), radial-gradient(2px 2px at 35% 65%, #ffe680, transparent), radial-gradient(1.5px 1.5px at 60% 30%, #fff, transparent), radial-gradient(2px 2px at 80% 75%, #b3e0ff, transparent), radial-gradient(1.5px 1.5px at 92% 15%, #fff, transparent), radial-gradient(2px 2px at 22% 88%, #fff, transparent); animation: twinkle 1.8s ease-in-out infinite; }
  @keyframes twinkle { 0%,100% { opacity: .3; } 50% { opacity: 1; } }
  .profile-fx-glitch { position: relative; }
  .profile-fx-glitch::before { content: ""; position: absolute; inset: 0; pointer-events: none; z-index: 3; border-radius: 14px; box-shadow: inset 2px 0 0 rgba(255,0,80,.45), inset -2px 0 0 rgba(0,229,255,.45); animation: glitchShift 2.2s steps(2, end) infinite; }
  @keyframes glitchShift { 0%,88%,100% { transform: translateX(0); opacity: 0; } 90% { transform: translateX(-3px); opacity: 1; } 93% { transform: translateX(3px); opacity: 1; } 96% { transform: translateX(-2px); opacity: .8; } }
  .profile-fx-matrix { position: relative; overflow: hidden; }
  .profile-fx-matrix::after { content: ""; position: absolute; inset: 0; pointer-events: none; z-index: 3; border-radius: 14px; background-image: repeating-linear-gradient(0deg, rgba(60,255,120,.14) 0 2px, transparent 2px 26px), radial-gradient(2px 2px at 15% 30%, #3cff78, transparent), radial-gradient(2px 2px at 75% 55%, #3cff78, transparent), radial-gradient(2px 2px at 45% 80%, #3cff78, transparent); animation: matrixDrop 2.8s linear infinite; }
  @keyframes matrixDrop { from { background-position: 0 -26px, 0 0, 0 0, 0 0; } to { background-position: 0 26px, 0 0, 0 0, 0 0; } }
  .profile-fx-neonframe { position: relative; }
  .profile-fx-neonframe::after { content: ""; position: absolute; inset: 0; pointer-events: none; z-index: 3; border-radius: 14px; border: 2px solid rgba(157,107,255,.8); box-shadow: 0 0 12px rgba(157,107,255,.8), inset 0 0 12px rgba(157,107,255,.4); animation: neonPulse 1.6s ease-in-out infinite; }
  @keyframes neonPulse { 0%,100% { opacity: .55; } 50% { opacity: 1; } }

  /* extra name effects */
  .fx-glow-green { animation: fxGreen 2s ease-in-out infinite; }
  @keyframes fxGreen { 0%,100% { text-shadow: 0 0 6px rgba(60,255,120,.6); } 50% { text-shadow: 0 0 16px rgba(60,255,120,1), 0 0 30px rgba(0,255,90,.5); } }
  .fx-glitch-name { animation: glitchName 2.4s steps(2, end) infinite; }
  @keyframes glitchName { 0%,90%,100% { text-shadow: none; transform: translateX(0); } 92% { text-shadow: -2px 0 rgba(255,0,80,.8), 2px 0 rgba(0,229,255,.8); transform: translateX(-1px); } 95% { text-shadow: 2px 0 rgba(255,0,80,.8), -2px 0 rgba(0,229,255,.8); transform: translateX(1px); } }
  .fx-wave { display: inline-block; animation: waveName 1.8s ease-in-out infinite; }
  @keyframes waveName { 0%,100% { transform: translateY(0) rotate(0); } 30% { transform: translateY(-2px) rotate(-1.5deg); } 60% { transform: translateY(1px) rotate(1deg); } }
  .fx-flicker { animation: flickerName 2.2s linear infinite; }
  @keyframes flickerName { 0%,19%,21%,54%,56%,100% { opacity: 1; text-shadow: 0 0 10px rgba(255,255,255,.6); } 20%,53% { opacity: .45; text-shadow: none; } }
  .fx-ice { animation: fxIce 2.6s ease-in-out infinite; }
  @keyframes fxIce { 0%,100% { text-shadow: 0 0 6px rgba(120,220,255,.7), 0 0 14px rgba(120,220,255,.4); } 50% { text-shadow: 0 0 16px rgba(160,240,255,1), 0 0 30px rgba(80,180,255,.7); } }
  .fx-shadowed { text-shadow: 2px 2px 0 rgba(0,0,0,.55); }
  .fx-none {}

  /* cosmic badges — clipped diamond frames, multi-stop gradients, neon glow */
  .badge-ico {
    display: inline-grid; place-items: center; width: 20px; height: 20px; font-size: 10.5px;
    background: var(--card-2); border: 1px solid var(--border); cursor: default;
    clip-path: polygon(50% 0%, 93% 7%, 100% 50%, 93% 93%, 50% 100%, 7% 93%, 0% 50%, 7% 7%);
    border-radius: 0; border: none;
    position: relative;
    filter: drop-shadow(0 0 4px var(--accent-color, var(--accent)));
    transition: all 0.2s ease;
    isolation: isolate;
  }
  /* gradient ring behind the clipped face */
  .badge-ico::before {
    content: ""; position: absolute; inset: 0; z-index: -1;
    clip-path: inherit;
    background: var(--badge-grad, linear-gradient(135deg, var(--card-2), var(--card-2)));
  }
  .badge-ico::after {
    content: ""; position: absolute; inset: 1.5px; z-index: -1;
    clip-path: inherit;
    background: linear-gradient(180deg, rgba(11,9,20,.92), rgba(11,9,20,.75));
  }
  .badge-ico > .b-ico-face { position: relative; z-index: 1; }
  .badge-ico:hover {
    transform: scale(1.15);
    filter: drop-shadow(0 0 4px var(--accent-color, var(--accent))) drop-shadow(0 0 8px var(--accent-color, var(--accent)));
    z-index: 20;
  }
  /* space-themed tooltip (data-tip pattern, galaxy styled) */
  .badge-ico[data-btip]:hover::after { display: none; }
  .badge-ico[data-btip]:hover .b-tip { opacity: 1; visibility: visible; transform: translate(-50%, 0); }
  .b-tip {
    position: absolute; bottom: calc(100% + 8px); left: 50%; transform: translate(-50%, 4px);
    background: linear-gradient(180deg, rgba(24,18,45,.97), rgba(13,11,33,.97));
    border: 1px solid rgba(157,78,221,.4); border-radius: 7px;
    padding: 6px 10px; font-size: 11.5px; font-weight: 700; color: var(--text);
    white-space: nowrap; z-index: 400; pointer-events: none;
    box-shadow: 0 0 16px rgba(157,78,221,.25), 0 6px 18px rgba(0,0,0,.55);
    opacity: 0; visibility: hidden; transition: all 0.2s ease;
  }
  .b-tip .b-tip-name { color: var(--accent-2); }
  .b-tip .b-tip-desc { display: block; color: var(--muted); font-weight: 500; font-size: 10.5px; }
  /* cosmic gradients per rank */
  .badge-ico.b-owner     { --badge-grad: linear-gradient(135deg, #ffd76a, #faa61a 45%, #9D4EDD); --accent-color: #faa61a; }
  .badge-ico.b-co_owner  { --badge-grad: linear-gradient(135deg, #9D4EDD, #7B2FF7 50%, #5865f2); --accent-color: #9D4EDD; }
  .badge-ico.b-developer { --badge-grad: linear-gradient(135deg, #00F5D4, #00c8ff 50%, #4361ee); --accent-color: #00F5D4; }
  .badge-ico.b-early     { --badge-grad: linear-gradient(135deg, #ff5f6d, #ffc371 60%, #ffd76a); --accent-color: #ff8a5c; }
  .badge-ico.b-booster   { --badge-grad: linear-gradient(135deg, #ff2e88, #f472b6 45%, #c56bff); --accent-color: #ff5fb8; }
  .badge-ico.b-bot       { --badge-grad: linear-gradient(135deg, #9D4EDD, #00F5D4); --accent-color: #9D4EDD; }
  .badge-ico.sm { width: 16px; height: 16px; font-size: 8.5px; }
  .badge-row { display: flex; gap: 5px; flex-wrap: wrap; }

  /* ranks (server roles) */
  .rank-chip { display: inline-flex; align-items: center; gap: 5px; font-size: 10.5px; font-weight: 800; border-radius: 5px; padding: 1px 7px; letter-spacing: .03em; text-transform: uppercase; }
  .rank-dot { width: 8px; height: 8px; border-radius: 50%; }

  /* Astro claim */
  .bubbly {
    font-family: 'Comic Sans MS', 'Comic Sans', 'Chalkboard SE', 'Segoe UI', cursive;
    font-weight: 800; letter-spacing: .04em;
    background: linear-gradient(90deg, #ffd76b, #ff8fab, #9d6bff, #58c7ff, #ffd76b);
    background-size: 300% 100%; -webkit-background-clip: text; background-clip: text; color: transparent;
    animation: fxRainbow 5s linear infinite, bubblyPop 1.6s ease-in-out infinite;
    filter: drop-shadow(0 0 10px rgba(157,107,255,.55));
  }
  @keyframes bubblyPop { 0%,100% { transform: scale(1); } 50% { transform: scale(1.05); } }
  .astro-claim-btn {
    font-family: 'Comic Sans MS', 'Comic Sans', 'Chalkboard SE', cursive;
    font-size: 22px; font-weight: 800; letter-spacing: .03em;
    background: linear-gradient(135deg, #9d6bff, #5865f2); color: #fff;
    border: none; border-radius: 999px; padding: 16px 44px; cursor: pointer;
    box-shadow: 0 0 22px rgba(157,107,255,.55), 0 6px 22px rgba(0,0,0,.4);
    animation: bubblyPop 1.8s ease-in-out infinite;
    transition: filter .15s;
  }
  .astro-claim-btn:hover { filter: brightness(1.15); }

  /* server settings page */
  #srvPage { position: fixed; inset: 28px 0 0 0; z-index: 820; display: none; background: var(--rail); color: var(--text); }
  #srvPage.show { display: flex; }
  .srv-hero { display: flex; gap: 22px; align-items: flex-start; }
  .srv-preview { width: 260px; background: var(--card); border: 1px solid var(--border); border-radius: 14px; overflow: hidden; flex: none; }
  .srv-preview .sp-banner { height: 90px; background-size: cover; background-position: center; }
  .srv-preview .sp-body { padding: 0 14px 14px; }
  .srv-preview .sp-ico { width: 52px; height: 52px; border-radius: 14px; background: var(--card-2); display: grid; place-items: center; font-size: 24px; margin: -26px 0 8px; border: 4px solid var(--card); font-family: 'Comic Sans MS', cursive; }
  .srv-preview .sp-name { font-weight: 800; font-size: 16px; }
  .srv-preview .sp-meta { font-size: 12px; color: var(--muted); margin-top: 3px; }
  .banner-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; max-width: 420px; }
  .banner-grid button { height: 52px; border-radius: 10px; border: 2px solid transparent; cursor: pointer; }
  .banner-grid button.on { border-color: var(--accent); }
  .rank-row { display: flex; align-items: center; gap: 10px; padding: 10px 0; border-bottom: 1px solid var(--border); }
  .rank-row .rr-name { font-weight: 700; flex: 1; display: flex; align-items: center; gap: 8px; }
  .member-pick { display: flex; align-items: center; gap: 8px; padding: 6px 0; }
  .member-pick select { background: var(--rail); color: var(--text); border: 1px solid var(--border); border-radius: 6px; padding: 6px 8px; font: inherit; }
  .msg { position: relative; padding: 2px 48px 2px 72px; }
  .msg:hover { background: rgba(255,255,255,.03); }
  .msg.grouped .g-time {
    display: none; position: absolute; left: 0; width: 62px; top: 4px;
    text-align: right; color: var(--faint); font-size: 10.5px; font-weight: 600;
  }
  .msg.grouped:hover .g-time { display: block; }
  .msg.first { margin-top: 16px; }
  .msg.flash { animation: flash 2.2s ease; }
  .day-divider::before, .day-divider::after { background: #3a2c55; }
  @keyframes flash { 0%, 60% { background: rgba(88,101,242,.18); } 100% { background: transparent; } }
  .m-av { position: absolute; left: 16px; top: 4px; }
  .m-head { display: flex; align-items: baseline; gap: 8px; }
  .m-name { font-weight: 500; font-size: 1rem; cursor: pointer; color: var(--text); }
  .m-name:hover { text-decoration: underline; }
  .m-time { color: var(--faint); font-size: 11.5px; }

  .m-sys-tag {
    background: var(--card-2); color: var(--muted); font-size: 9.5px; font-weight: 800;
    border-radius: 4px; padding: 1.5px 5px; letter-spacing: .05em; position: relative; top: -1.5px;
    text-transform: uppercase;
  }
  .m-text { color: #dbdee1; line-height: 1.375rem; font-size: 1rem; user-select: text; word-wrap: break-word; white-space: pre-wrap; }
  .m-text a { color: #00a8fc; text-decoration: none; }
  .m-text a:hover { text-decoration: underline; }
  .m-text code { background: #191322; border: 1px solid #2a2040; border-radius: 4px; padding: 1px 5px; font-family: ui-monospace, Consolas, monospace; font-size: 13px; }
  .m-text pre { background: #191322; border: 1px solid #2a2040; border-radius: 6px; padding: 8px 10px; margin: 4px 0; max-width: 640px; overflow-x: auto; }
  .m-text pre code { background: none; border: none; padding: 0; }
  .m-text .mention { background: rgba(88,101,242,.3); color: #c9cdfb; border-radius: 4px; padding: 0 3px; font-weight: 500; cursor: pointer; }
  .m-text .mention:hover { background: var(--accent); color: #ffffff; }
  .m-reply { display: flex; align-items: center; gap: 6px; font-size: 12.5px; color: var(--muted); margin-bottom: 2px; cursor: pointer; }
  .m-reply:hover { color: var(--text); }
  .m-reply .r-snip { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 420px; }
  .m-reply .r-snip b { color: var(--text); }
  .m-reply::before { content: ""; position: absolute; left: 26px; top: 0; width: 2.5%; height: 10px; border-left: 2px solid #5a4a7d; border-top: 2px solid #5a4a7d; border-top-left-radius: 6px; margin-top: 8px; }
  .m-reply { position: relative; margin-left: 20px; padding-left: 8px; }
  .m-edit-box textarea {
    width: 100%; background: var(--card); border: none; outline: none; color: var(--text);
    font: inherit; border-radius: 8px; padding: 10px 12px; resize: none; min-height: 40px;
  }
  .m-edit-hint { font-size: 11.5px; color: var(--muted); margin-top: 4px; }
  .m-edit-hint b { color: var(--warn); }

  .m-tools {
    position: absolute; top: -16px; right: 20px; display: none; align-items: center;
    background: var(--card); border-radius: 8px; box-shadow: 0 4px 14px rgba(0,0,0,.4);
    padding: 2px; z-index: 5;
  }
  .msg:hover .m-tools { display: flex; }
  .m-tools button { width: 30px; height: 30px; border-radius: 6px; display: grid; place-items: center; color: var(--muted); }
  .m-tools button:hover { background: var(--hover); color: var(--text); }
  .m-tools button.del:hover { color: var(--danger); }
  .m-tools svg { width: 17px; height: 17px; }

  /* ---------------- attachments / embeds ---------------- */
  .atts { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 6px; }
  .att-img {
    max-width: 380px; max-height: 300px; border-radius: 10px; cursor: zoom-in; display: block;
    border: 1px solid var(--border); background: #0c0e13;
  }
  .att-img:hover { border-color: var(--accent); }
  .att-file {
    display: inline-flex; align-items: center; gap: 10px; background: var(--card);
    border: 1px solid var(--border); border-radius: 10px; padding: 10px 14px; cursor: pointer;
    max-width: 360px;
  }
  .att-file:hover { border-color: var(--accent); }
  .att-file .af-ico { font-size: 22px; flex: none; }
  .att-file .af-info { display: flex; flex-direction: column; min-width: 0; }
  .att-file .af-info b { font-size: 13.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .att-file .af-size { font-size: 11.5px; color: var(--muted); }
  .m-av .st { border-color: var(--chat); }

  #pendingBar { display: none; flex-wrap: wrap; gap: 6px; padding: 8px 8px 0; }
  #pendingBar.show { display: flex; }
  .pending-chip {
    display: inline-flex; align-items: center; gap: 7px; background: var(--card);
    border: 1px solid var(--border); border-radius: 8px; padding: 5px 8px; font-size: 12.5px; max-width: 240px;
  }
  .pending-chip img { width: 26px; height: 26px; object-fit: cover; border-radius: 5px; }
  .pending-chip .pc-name { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 150px; }
  .pending-chip .pc-x { color: var(--muted); font-weight: 800; }
  .pending-chip .pc-x:hover { color: var(--danger); }

  #dropOverlay {
    position: absolute; inset: 8px; border: 2px dashed var(--accent); border-radius: 14px;
    background: rgba(88,101,242,.12); display: none; place-items: center; z-index: 200;
    font-size: 18px; font-weight: 800; color: var(--accent); pointer-events: none;
  }
  #dropOverlay.show { display: grid; }

  .reactions { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 4px; }
  .react {
    display: inline-flex; align-items: center; gap: 6px; background: rgba(255,255,255,.05);
    border: 1px solid transparent; border-radius: 8px; padding: 2px 8px; font-size: 14px; cursor: pointer;
  }
  .react .rc { font-size: 12.5px; font-weight: 700; color: var(--muted); }
  .react:hover { border-color: var(--muted); }
  .react.mine { background: rgba(157,78,221,.15); border-color: var(--accent); }
  .react.mine .rc { color: #c9cdfb; }

  /* composer */
  #composerWrap { padding: 0 16px 22px; position: relative; }
  #replyBar {
    display: none; align-items: center; gap: 8px; background: var(--card-2);
    border-radius: 10px 10px 0 0; padding: 7px 14px; font-size: 13px; color: var(--muted);
  }
  #replyBar.show { display: flex; }
  #replyBar .rb-x { margin-left: auto; color: var(--muted); }
  #replyBar .rb-x:hover { color: var(--text); }
  #composer {
    display: flex; align-items: flex-end; background: var(--card-2); border-radius: 10px; padding: 0 6px 0 16px;
    border: 1px solid rgba(157,78,221,.22);
    box-shadow: 0 0 14px 1px rgba(157,78,221,.14), inset 0 1px 0 rgba(255,255,255,.03);
    transition: box-shadow .25s ease, border-color .25s ease;
  }
  #composer:focus-within {
    border-color: rgba(157,78,221,.6);
    box-shadow: 0 0 0 1px rgba(157,78,221,.35), 0 0 22px 3px var(--glow-soft), 0 0 44px 6px rgba(0,245,212,.10), inset 0 1px 0 rgba(255,255,255,.04);
  }
  #replyBar.show + #composer { border-radius: 0 0 10px 10px; }
  .c-btn { width: 34px; height: 34px; margin-bottom: 7px; display: grid; place-items: center; color: var(--muted); flex: none; border-radius: 6px; }
  .c-btn:hover { color: var(--text); }
  .c-btn svg { width: 21px; height: 21px; }
  #composer textarea {
    flex: 1; background: none; border: none; outline: none; color: var(--text);
    font: inherit; resize: none; padding: 12px 8px; max-height: 160px; line-height: 1.4;
  }
  #composer textarea::placeholder { color: var(--faint); }

  return { serverId: db.ui.voice.serverId, channelId: db.ui.voice.channelId, sharing, quality: window.__call.shareQuality };
}
function announceVoice(extra) {
  const st = myVoiceState();
  api("/api/voice/state", { body: { ...(st || { leave: true }), ...(extra || {}) } }).catch(() => {});
}
function bestTracks(kind) {
  /* pick the streams I'm sharing; a viewer gets whatever exists (screen preferred for video) */
  const c = window.__call;
  return kind === "cam" ? (c.camStream || c.shareStream) : (c.shareStream || c.camStream);
}
function makePeer(peerName, isCaller) {
  const pc = new RTCPeerConnection({ iceServers: [{ urls: "stun:stun.l.google.com:19302" }] });
  rtcPeers.set(peerName, pc);
  /* my outgoing streams: screen, camera, and always the mic when we're in a call */
  for (const kind of ["screen", "cam"]) {
    const s = kind === "screen" ? window.__call.shareStream : window.__call.camStream;
    if (s) s.getTracks().forEach(t => { pc.addTrack(t, s); });
  }
  const mic = outgoingAudioStream();
  if (db.ui.voice && mic) mic.getAudioTracks().forEach(t => pc.addTrack(t, mic));
  pc.onicecandidate = e => { if (e.candidate) api("/api/rtc/signal", { body: { to: peerName, signal: JSON.stringify({ ice: e.candidate }) } }).catch(() => {}); };
  pc.onconnectionstatechange = () => { if (["failed", "closed"].includes(pc.connectionState)) dropPeer(peerName); };
  if (isCaller) {
    pc.onnegotiationneeded = async () => {
      try {
        const offer = await pc.createOffer();
        await pc.setLocalDescription(offer);
        await api("/api/rtc/signal", { body: { to: peerName, signal: JSON.stringify({ sdp: pc.localDescription }) } });
      } catch {}
    };
  } else {
    const bindRemote = track => {
      if (!track) return;
      track.addEventListener("unmute", () => ingestRemote());
      let ms = rtcIncoming.get(peerName);
      if (!ms) { ms = new MediaStream([track]); rtcIncoming.set(peerName, ms); }
      else if (!ms.getTracks().includes(track)) ms.addTrack(track);
    };
    pc.ontrack = e => {
      const remote = e.streams && e.streams[0];
      if (remote) { rtcIncoming.set(peerName, remote); }
      else if (e.track) { bindRemote(e.track); }
      /* play their voice */
      if (e.track && e.track.kind === "audio") attachRemoteAudio(peerName, new MediaStream([e.track]));
      renderVoiceMembers();
    };
    /* answerer-side transceivers can predate ontrack: sweep receivers periodically */
    const sweep = setInterval(() => {
      if (!rtcPeers.has(peerName)) return clearInterval(sweep);
      let got = false;
      (pc.getReceivers() || []).forEach(r => {
        if (r.track && r.track.readyState === "live") {
          bindRemote(r.track);
          if (r.track.kind === "audio") attachRemoteAudio(peerName, new MediaStream([r.track]));
          got = true;
        }
      });
      if (got && rtcIncoming.has(peerName)) { renderVoiceMembers(); clearInterval(sweep); }
    }, 700);
    setTimeout(() => clearInterval(sweep), 20000);
  }

}
function dropPeer(peerName) {
  const pc = rtcPeers.get(peerName);
  if (pc) { try { pc.close(); } catch {} rtcPeers.delete(peerName); }
  rtcIncoming.delete(peerName);
  const a = remoteAudios.get(peerName);
  if (a) { try { a.srcObject = null; a.remove(); } catch {} remoteAudios.delete(peerName); }
  renderVoiceMembers();
}
function dropAllPeers() {
  [...rtcPeers.keys()].forEach(dropPeer);
}

async function handleRtcSignal(from, signal) {
  let pc = rtcPeers.get(from);
  if (signal.sdp) {
    if (!pc) pc = makePeer(from, false);
    await pc.setRemoteDescription(signal.sdp);
    if (signal.sdp.type === "offer") {
      const answer = await pc.createAnswer();
      await pc.setLocalDescription(answer);
      await api("/api/rtc/signal", { body: { to: from, signal: JSON.stringify({ sdp: pc.localDescription }) } });
    }
  } else if (signal.ice && pc) {
    try { await pc.addIceCandidate(signal.ice); } catch {}
  }
}

/* when voice states change: sync peers (I become caller toward peers already sharing) */
function syncVoicePeers(states) {
  if (!db.ui.voice) return dropAllPeers();
  const others = Object.entries(states || {}).filter(([n, s]) => n !== currentUser && s.serverId === db.ui.voice.serverId && s.channelId === db.ui.voice.channelId);
  const names = new Set(others.map(([n]) => n));
  /* drop peers who left the channel OR stopped sharing (nothing to watch) */
  const sharingNow = new Set(others.filter(([, s]) => s.sharing).map(([n]) => n));
  [...rtcPeers.keys()].forEach(n => {
    if (!names.has(n)) return dropPeer(n);
    if (!sharingNow.has(n) && !rtcIncoming.has(n)) return; /* idle peer, keep only if sharing */
    if (!sharingNow.has(n) && rtcIncoming.has(n)) dropPeer(n); /* they stopped sharing */
  });
  for (const [n, s] of others) {
    const iShare = !!(window.__call.shareStream || window.__call.camStream);
    if (iShare && !rtcPeers.has(n)) makePeer(n, true); /* I'm sharing: connect to everyone */
  }
  renderVoiceMembers();
}

  if (!np().sound) return;
  try {
    notifAudioCtx = notifAudioCtx || new (window.AudioContext || window.webkitAudioContext)();
    const t = notifAudioCtx.currentTime;
    [[880, 0], [1174.66, 0.09]].forEach(([f, off]) => {
      const o = notifAudioCtx.createOscillator(), g = notifAudioCtx.createGain();
      o.type = "sine"; o.frequency.value = f;

      g.gain.exponentialRampToValueAtTime(0.001, t + off + 0.28);
      o.connect(g); g.connect(notifAudioCtx.destination);

async function hashPass(pw) {
  const salted = "disglobe::" + pw;
  try {
    const buf = await crypto.subtle.digest("SHA-256", new TextEncoder().encode(salted));
    return [...new Uint8Array(buf)].map(b => b.toString(16).padStart(2, "0")).join("");
  } catch {
    let h = 5381;
    for (let i = 0; i < salted.length; i++) h = ((h << 5) + h + salted.charCodeAt(i)) >>> 0;
    return "f" + h.toString(16) + "_" + salted.length;
  }
}

/* ---------- galaxy starfield ----------
   ~180 stars in three depth layers, slow drift + twinkle. One rAF loop, DPR-capped,
   pauses when the tab is hidden. CPU cost is negligible. */
(function starfield() {
  const cv = document.getElementById("starfield");
  if (!cv || matchMedia("(prefers-reduced-motion: reduce)").matches) return;
  const ctx = cv.getContext("2d");
  if (!ctx) return;
  const DPR = Math.min(window.devicePixelRatio || 1, 2);
  let W = 0, H = 0, stars = [], running = true, raf = 0, last = 0;
  const TAU = Math.PI * 2;
  function resize() {
    W = cv.clientWidth; H = cv.clientHeight;
    cv.width = Math.round(W * DPR); cv.height = Math.round(H * DPR);
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    const target = Math.min(220, Math.round((W * H) / 9000));
    while (stars.length < target) stars.push(makeStar());
    stars.length = target;
  }
  function makeStar() {
    const layer = Math.random();
    return {
      x: Math.random() * W, y: Math.random() * H,
      r: layer < .6 ? Math.random() * .8 + .4 : layer < .9 ? Math.random() * .9 + 1.0 : Math.random() * 1.1 + 1.7,
      vx: (layer < .6 ? .015 : layer < .9 ? .03 : .05) * (Math.random() < .5 ? -1 : 1),
      vy: (layer < .6 ? .01 : layer < .9 ? .02 : .035),
      base: .25 + Math.random() * .55,
      amp: .25 + Math.random() * .55,
      phase: Math.random() * TAU,
      tw: .4 + Math.random() * 1.2,               // twinkle speed (rad/s)
      cyan: Math.random() < .3,                    // some stars get a cyan tint
    };
  }
  function frame(t) {
    if (!running) { raf = 0; return; }
    raf = requestAnimationFrame(frame);
    const dt = Math.min((t - last) / 1000, .1); last = t;
    ctx.clearRect(0, 0, W, H);
    for (const s of stars) {
      s.x += s.vx * dt * 60 * .1; s.y += s.vy * dt * 60 * .1;
      if (s.x < -3) s.x = W + 3; else if (s.x > W + 3) s.x = -3;
      if (s.y > H + 3) s.y = -3; else if (s.y < -3) s.y = H + 3;
      s.phase += s.tw * dt;
      const a = s.base + s.amp * Math.sin(s.phase);
      ctx.beginPath();
      ctx.arc(s.x, s.y, s.r, 0, TAU);
      ctx.fillStyle = s.cyan ? `rgba(140, 245, 255, ${a.toFixed(3)})` : `rgba(255,255,255,${a.toFixed(3)})`;
      ctx.fill();
      if (s.r > 2) {                                  // big stars get a tiny glow
        ctx.beginPath(); ctx.arc(s.x, s.y, s.r * 2.4, 0, TAU);
        ctx.fillStyle = s.cyan ? `rgba(0,245,212,${(a * .12).toFixed(3)})` : `rgba(157,78,221,${(a * .12).toFixed(3)})`; ctx.fill();
        }
    }
  }
  function start() { if (!raf && running) { last = performance.now(); raf = requestAnimationFrame(frame); } }
  document.addEventListener("visibilitychange", () => { running = !document.hidden; if (running) start(); });
  window.addEventListener("resize", resize);
  resize(); start();
})();

/* ---------- file storage: big blobs live in IndexedDB, metadata in localStorage ----------
   localStorage tops out around 5–10 MB per origin, so a 25 MB upload could never fit as
   a data URL. Blobs go to IndexedDB (hundreds of MB of quota); messages keep only
   metadata and images hydrate from object URLs after render. GIFs stay animated. */
const IDB = (() => {
  let dbp = null;
  function open() {
    if (dbp) return dbp;
    dbp = new Promise((res, rej) => {
      const rq = indexedDB.open("disglobe-files", 1);
      rq.onupgradeneeded = () => rq.result.createObjectStore("files");
      rq.onsuccess = () => res(rq.result);
      rq.onerror = () => rej(rq.error);
    });
    return dbp;
  }
  async function tx(mode, fn) {
    const d = await open();
    return new Promise((res, rej) => {
      const t = d.transaction("files", mode);
      const rq = fn(t.objectStore("files"));
      rq.onsuccess = () => res(rq.result);
      rq.onerror = () => rej(rq.error);
    });
  }
  return {
    put: (k, v) => tx("readwrite", s => s.put(v, k)),
    get: k => tx("readonly", s => s.get(k)),
    del: k => tx("readwrite", s => s.delete(k)),
    keys: () => tx("readonly", s => s.getAllKeys()),
  };
})();

function dataUrlToBlob(dataUrl) {
  const [head, b64] = dataUrl.split(",");
  const mime = (head.match(/data:(.*?)(;|$)/) || [])[1] || "application/octet-stream";
  const bin = atob(b64);
  const arr = new Uint8Array(bin.length);
  for (let i = 0; i < bin.length; i++) arr[i] = bin.charCodeAt(i);
  return new Blob([arr], { type: mime });
}

/* object-URL caches: profile media + one per attachment id, created lazily */
const mediaUrls = { avatar: null, banner: null };
const attUrls = new Map();
async function attUrl(id) {
  if (attUrls.has(id)) return attUrls.get(id);
  const blob = await IDB.get(id);
  if (!blob) return null;
  const u = URL.createObjectURL(blob);
  attUrls.set(id, u);
  return u;
}
async function hydrateAttachments() {
  for (const img of document.querySelectorAll(".att-img:not([src])")) {
    const u = await attUrl(img.dataset.att);
    if (u && document.contains(img)) img.src = u;
  }
}

/* one-time migration: older versions saved images as data URLs inside localStorage */
async function migrateLegacyMedia() {
  let changed = false;
  for (const slot of ["avatar", "banner"]) {
    const meta = db.user[slot];
    if (meta && meta.dataUrl) {
      try { await IDB.put(`pf:${currentUser}:${slot}`, dataUrlToBlob(meta.dataUrl)); delete meta.dataUrl; changed = true; } catch {}
    }
  }
  for (const key of Object.keys(db.msgs || {})) {
    for (const m of db.msgs[key]) for (const a of (m.attachments || [])) {
      if (a.dataUrl) { try { await IDB.put(a.id, dataUrlToBlob(a.dataUrl)); delete a.dataUrl; changed = true; } catch {} }
    }
  }
  if (changed) save();
}

/* load the logged-in user's avatar/banner blobs and turn them into object URLs */
async function loadProfileMedia() {
  await migrateLegacyMedia();
  for (const slot of ["avatar", "banner"]) {
    if (mediaUrls[slot]) { URL.revokeObjectURL(mediaUrls[slot]); mediaUrls[slot] = null; }
    const meta = db.user[slot];
    if (!meta) {
      /* no local blob — but the server may have the image (synced from another device);
         seed IndexedDB from the world payload's avatarData/bannerData */
      const dataUrl = slot === "avatar" ? db.user.avatarData : db.user.bannerData;
      if (dataUrl) {
        try {
          const blob = dataUrlToBlob(dataUrl);
          await IDB.put(`pf:${currentUser}:${slot}`, blob);
          mediaUrls[slot] = URL.createObjectURL(blob);
          db.user[slot] = { synced: true };
        } catch {}
      }
      continue;
    }
    const blob = await IDB.get(`pf:${currentUser}:${slot}`);
    if (blob) mediaUrls[slot] = URL.createObjectURL(blob);
    else db.user[slot] = null; // blob vanished (cleared site data) — fall back to initials
  }
}

async function purgeAttBlobs(list) {
  for (const m of list) for (const a of (m.attachments || [])) {

  }
}

async function processProfileMedia(file, kind) {
  // kind: 'avatar' | 'banner' — returns { blob, url, name, size, animated }
  if (!file || !file.type || !file.type.startsWith("image/")) throw new Error("Pick an image file (PNG, JPG, GIF, WebP).");
  if (file.size > MAX_FILE) throw new Error(`That image is ${fmtSize(file.size)} — the limit is ${fmtSize(MAX_FILE)}.`);
  const animated = file.type === "image/gif" || /\.gif$/i.test(file.name || "");
  if (animated) return { blob: file, url: URL.createObjectURL(file), name: file.name || "banner.gif", size: file.size, animated: true };
  // static images get resized + re-encoded to JPEG to keep storage lean
  const target = kind === "banner" ? { w: 600, h: 240 } : { w: 160, h: 160 };
  try {
    const blob = await new Promise((res, rej) => {
      const img = new Image();
      img.onload = () => {
        const c = document.createElement("canvas");
        const scale = Math.max(target.w / img.width, target.h / img.height);
        c.width = target.w; c.height = target.h;
        const ctx = c.getContext("2d");
        ctx.fillStyle = "#000";
        ctx.fillRect(0, 0, c.width, c.height);
        ctx.drawImage(img, (target.w - img.width * scale) / 2, (target.h - img.height * scale) / 2, img.width * scale, img.height * scale);
        c.toBlob(b => b ? res(b) : rej(new Error("encode failed")), "image/jpeg", 0.85);
      };
      img.onerror = rej;
      img.src = URL.createObjectURL(file);
    });
    return { blob, url: URL.createObjectURL(blob), name: file.name, size: blob.size, animated: false };
  } catch {
    return { blob: file, url: URL.createObjectURL(file), name: file.name, size: file.size, animated: false };
  }
}

function loadWorld() {

  for (const k of ["displayName", "pronouns", "customStatus", "bio", "nameEffect", "profileEffect", "badges"]) if (!(k in db.user)) db.user[k] = typeof db.user[k] === "boolean" ? false : (k === "badges" ? ["member"] : "");
  if (!("avatar" in db.user)) db.user.avatar = null;

function save() { return true; } /* the server persists everything; kept for call sites */
function persistProfile(changedSlots) {
  /* push the whole profile to the server, including avatar/banner as data URLs
     so they follow the account to any device (server caps: 2 MB avatar, 3 MB banner).
     changedSlots: optional array like ["avatar","banner"] or ["avatar"] — when given,
     only those image slots are uploaded. Call sites that just change text fields omit it. */
  const u = db.user;
  const slots = Array.isArray(changedSlots) ? changedSlots : [];
  const body = {
    displayName: u.displayName, pronouns: u.pronouns, customStatus: u.customStatus, bio: u.bio,
    color: u.color, status: u.status, nameEffect: u.nameEffect, profileEffect: u.profileEffect, badges: u.badges,
  };
  (async () => {
    try {
      for (const slot of slots) {
        const blob = u[slot] ? await IDB.get(`pf:${currentUser}:${slot}`) : null;
        if (blob) {
          const dataUrl = await blobToDataUrl(blob);
          if (dataUrl.length >= (slot === "avatar" ? 2 : 3) * 1024 * 1024) {
            toast(`Your ${slot} is too large to sync (${fmtSize(dataUrl.length)}) — shown locally only`);
            continue;
          }
          body[slot === "avatar" ? "avatarData" : "bannerData"] = dataUrl;
        } else if (u[slot] === null) {
          body[slot === "avatar" ? "avatarData" : "bannerData"] = null; // user cleared it — clear server-side too
        }
      }
    } catch {}
    api("/api/me", { body }).then(refreshWorld).catch(e => toast(e.message));
  })();
}

/* ================= invites: links that let people join a server =================
   An invite encodes the server name + channels in the URL hash, so a link works
   across devices/browsers with zero backend. */
async function makeInvite(s) {
  try {
    const r = await api(`/api/servers/${s.id}/invite`, { body: {} });
    return `${API.base}/#/join/${r.code}`;
  } catch (e) { toast(e.message); return null; }
}function parseInviteCode(link) {
  const s = String(link || "");
  const idx = s.indexOf("/join/");
  if (idx === -1) return null;
  return s.slice(idx + 6).split(/[?#]/)[0] || null;
}
async function joinFromInvite(code) {
  try {
    const r = await api("/api/join", { body: { code } });
    await refreshWorld();
    toast(`Joined "${r.server.name}" 🎉`);
    const f = r.server.categories.flatMap(c => c.channels).find(c => c.type === "text");
    if (f) openChannel(r.server.id, f.id);
  } catch (e) { toast(e.message); }
}
async function checkPendingInvite() {
  const code = parseInviteCode(location.hash) || parseInviteCode(location.href);
  if (!code) return;
  history.replaceState(null, "", location.pathname); // clean the URL
  modalConfirm("Join server?", "You've been invited to a Disglobe server. Join now?", () => joinFromInvite(code));
}

function dmKeyFor(id) { return "dm:" + [norm(currentUser), norm(id)].sort().join("|"); }

function pushMsg(key, m) {
  (db.msgs[key] ||= []).push(m);
  if (save()) return m;
  /* metadata couldn't save (quota) — roll back; blobs are purged by the caller */
  db.msgs[key].pop();
  toast("Storage is full — message not saved. Free up space (delete big attachments) and retry.");
  return null;
}

/* rank permission checks (server owner = always allowed) */
function rankAllows(channel, perm) {
  if (!db || db.ui.view !== "server") return true;
  const s = server(db.ui.serverId);
  if (!s) return true;
  if (s.owner === false || !s.ranks) return true; // no ranks configured = everything open
  const mine = (s.ranks || []).filter(r => (r.members || []).includes("me"));
  if (!mine.length) return true; // no rank assigned = unrestricted (single-user world)
  const p = (channel.perms || {})[mine[0].id];
  if (!p) return true; // no explicit restriction on this channel
  return p[perm] !== false;
}

async function sendCurrent() {
  const inp = $("#composerInput");
  const text = inp.value.trim();
  if (!text && !pending.length) return;
  if (db.ui.view === "server" && !rankAllows(curChan(), "send")) return toast("Your rank can't send messages in this channel 🔒");
  inp.value = ""; inp.style.height = "auto";
  const atts = pending.splice(0);
  for (const p of atts) {
    try { await IDB.put(p.id, p.blob); } catch { toast(`Couldn't store "${p.name}" — it won't be attached`); }
  }
  await handleOutgoing(text, atts);
  for (const p of atts) URL.revokeObjectURL(p.url); // embeds re-hydrate from IndexedDB
  renderMain();
  $("#composerInput").focus();
}

async function handleOutgoing(text, attachments) {
  const key = chanKey();
  /* local flair commands — no bot, just text transforms */
  if (text.startsWith("/shrug")) { text = text.replace(/^\/shrug\s*/, "").trim() + " ¯\\_(ツ)_/¯"; }
  else if (text.startsWith("/tableflip")) { text = text.replace(/^\/tableflip\s*/, "").trim() + " (╯°□°)╯︵ ┻━┻"; }
  else if (text.startsWith("/unflip")) { text = text.replace(/^\/unflip\s*/, "").trim() + " ┬─┬ ノ( ゜-゜ノ)"; }
  else if (text.startsWith("/me ")) { text = "*" + text.slice(4).trim() + "*"; }
  else if (text.startsWith("/") && !text.startsWith("//")) {
    toast("Unknown command — try /shrug, /tableflip, /unflip or /me"); return;
  }
  const m = { id: uid(), uid: currentUser, ts: Date.now(), text, reactions: {} };
  if (attachments && attachments.length) m.attachments = attachments.map(({ blob, url, ...meta }) => ({ ...meta, dataUrl: meta._dataUrl }));
  if (replyTarget) { m.replyTo = replyTarget; closeReply(); }
  /* online mode: attachments go up as data URLs with the message */
  if (attachments && attachments.length) {
    m.attachments = [];
    for (const p of attachments) {
      try {
        const dataUrl = await blobToDataUrl(p.blob);
        m.attachments.push({ name: p.name, size: p.size, kind: p.kind, dataUrl });
      } catch { toast(`Couldn't attach "${p.name}"`); }
    }
  }
  try {
    const resp = await api("/api/messages", { body: { key, text: m.text, attachments: m.attachments || [], replyTo: m.replyTo } });
    API.world.msgs[key] = API.world.msgs[key] || [];
    if (!API.world.msgs[key].some(x => x.id === resp.msg.id)) API.world.msgs[key].push(resp.msg);
    db.msgs[key] = API.world.msgs[key];
    const scroll = $("#chatScroll");
    pinned = !scroll || scroll.scrollHeight - scroll.scrollTop - scroll.clientHeight < 120;
    renderMain(); renderSidebar();
  } catch (e) { toast(e.message); }
}
function blobToDataUrl(blob) {
  return new Promise((res, rej) => { const fr = new FileReader(); fr.onload = () => res(fr.result); fr.onerror = rej; fr.readAsDataURL(blob); });
}

  const el = document.querySelector(`.msg[data-msg="${m.id}"] .m-text`) || document.querySelector(`.msg[data-msg="${m.id}"]`);

  ta.focus(); ta.setSelectionRange(ta.value.length, ta.value.length);
  ta.addEventListener("keydown", ev => {
    if (ev.key === "Escape") { ev.stopPropagation(); cancelEdit(); }
    if (ev.key === "Enter" && !ev.shiftKey) { ev.preventDefault(); m.text = ta.value.trim() || m.text; editingId = null; save(); renderMain(); }

}

/* ================= attachments: pick, paste, drop ================= */

const MAX_FILE = 25 * 1048576;     // 25 MB per file
const MAX_ATTACHMENTS = 4;         // per message
let pending = [];                  // staged attachments

async function stageFiles(fileList) {
  const files = [...fileList].slice(0, MAX_ATTACHMENTS - pending.length);
  let skipped = [...fileList].length - files.length;
  for (const f of files) {
    if (f.size > MAX_FILE) { toast(`"${f.name}" is ${fmtSize(f.size)} — max is ${fmtSize(MAX_FILE)}`); continue; }
    const kind = f.type && f.type.startsWith("image/") ? "image" : "file";
    pending.push({ id: uid(), name: f.name || "file", size: f.size, kind, mime: f.type || "", blob: f, url: URL.createObjectURL(f) });
  }
  const bar = $("#pendingBar");
  if (bar) { bar.className = pending.length ? "show" : ""; bar.innerHTML = pendingHTML(); }
  if (skipped > 0) toast(`${skipped} file${skipped > 1 ? "s" : ""} skipped (max ${MAX_ATTACHMENTS} per message)`);
  const inp = $("#composerInput"); if (inp) inp.focus();
}

function unstage(id) {
  const p = pending.find(x => x.id === id);
  if (p) URL.revokeObjectURL(p.url);
  pending = pending.filter(x => x.id !== id);
  const bar = $("#pendingBar");
  if (bar) { bar.className = pending.length ? "show" : ""; bar.innerHTML = pendingHTML(); }
}

function findAttachment(msgId, attId) {
  const m = (db.msgs[chanKey()] || []).find(x => x.id === msgId);
  return { m, a: m && (m.attachments || []).find(x => x.id === attId) };
}

function downloadAttachment(a) {
  return attUrl(a.id).then(u => {
    if (!u) return toast("That file's data is missing (site data may have been cleared)");
    const link = document.createElement("a");
    link.href = u;
    link.download = a.name;
    document.body.appendChild(link);
    link.click();
    link.remove();
  });
}

/* lightbox */
const lightbox = $("#lightbox");
let lightboxAtt = null;
async function openLightbox(a) {
  const u = await attUrl(a.id);
  if (!u) return toast("That image's data is missing (site data may have been cleared)");
  lightboxAtt = a;
  lightbox.querySelector("img").src = u;
  lightbox.querySelector(".lb-cap").textContent = `${a.name} · ${fmtSize(a.size)}`;
  lightbox.classList.add("show");
}
function closeLightbox() { lightbox.classList.remove("show"); lightbox.querySelector("img").src = ""; lightboxAtt = null; }
$("#lbClose").onclick = closeLightbox;
lightbox.addEventListener("click", e => { if (e.target === lightbox) closeLightbox(); });
$("#lbDownload").onclick = () => { if (lightboxAtt) downloadAttachment(lightboxAtt); };

/* drag & drop */
let dragDepth = 0;
document.addEventListener("dragenter", e => {
  if (!db || e.target.closest("#auth")) return;
  if (e.dataTransfer && [...e.dataTransfer.types].includes("Files")) {
    dragDepth++;
    const ov = $("#dropOverlay"); if (ov) ov.classList.add("show");
  }
});
document.addEventListener("dragleave", () => {
  if (--dragDepth <= 0) { dragDepth = 0; const ov = $("#dropOverlay"); if (ov) ov.classList.remove("show"); }
});
document.addEventListener("dragover", e => e.preventDefault());
document.addEventListener("drop", e => {
  e.preventDefault();
  dragDepth = 0;
  const ov = $("#dropOverlay"); if (ov) ov.classList.remove("show");
  if (!db || $("#composerWrap") == null) return;
  if (e.dataTransfer && e.dataTransfer.files && e.dataTransfer.files.length) stageFiles(e.dataTransfer.files);
});

function wireProfileEditor(pane, u) {

    gifTag();
  };
  pane.querySelector("#stColors").addEventListener("click", e => {
    const b = e.target.closest("button"); if (!b) return;
    color = b.dataset.c;
    colors.forEach(x => x.classList.toggle("on", x === b));
    paint();
  });
  pane.querySelector("#stName").addEventListener("input", paint);
  pane.querySelector("#stAvBtn").onclick = () => pane.querySelector("#stAvFile").click();
  pane.querySelector("#stBannerBtn").onclick = () => pane.querySelector("#stBannerFile").click();
  pane.querySelector("#stAvFile").onchange = async e => {
    const f = e.target.files[0]; e.target.value = ""; if (!f) return;
    try { draft.avatar = await processProfileMedia(f, "avatar"); paint(); toast("Avatar staged — hit Save Changes"); }
    catch (err) { toast(err.message); }
  };
  pane.querySelector("#stBannerFile").onchange = async e => {
    const f = e.target.files[0]; e.target.value = ""; if (!f) return;
    try { draft.banner = await processProfileMedia(f, "banner"); paint(); toast("Banner staged — hit Save Changes"); }
    catch (err) { toast(err.message); }
  };
  pane.querySelector("#stAvClear").onclick = () => { draft.avatar = null; paint(); };
  pane.querySelector("#stBannerClear").onclick = () => { draft.banner = null; paint(); };
  pane.querySelector("#stResetProfile").onclick = () => { closeSettingsPage(); openSettingsPage("profile"); };
  pane.querySelector("#stSave").onclick = async () => {
    u.displayName = pane.querySelector("#stName").value.trim();
    u.pronouns = pane.querySelector("#stPronouns").value.trim();
    u.customStatus = pane.querySelector("#stCustom").value.trim();
    u.bio = pane.querySelector("#stBio").value.trim();
    u.color = color;
    u.nameEffect = nameFx;
    u.profileEffect = profFx;
    u.badges = badges;
    const pushed = [];
    for (const slot of ["avatar", "banner"]) {
      const d = draft[slot];
      if (d === null) {
        try { await IDB.del(`pf:${currentUser}:${slot}`); } catch {}
        if (mediaUrls[slot]) { URL.revokeObjectURL(mediaUrls[slot]); mediaUrls[slot] = null; }
        u[slot] = null;
        pushed.push(slot);
      } else if (d && d.blob) {
        try { await IDB.put(`pf:${currentUser}:${slot}`, d.blob); }
        catch { toast("Couldn't store the image (storage full?)"); continue; }
        if (mediaUrls[slot]) URL.revokeObjectURL(mediaUrls[slot]);
        mediaUrls[slot] = d.url;
        u[slot] = { name: d.name, size: d.size, animated: d.animated };
        pushed.push(slot);
      }
    }
    save(); persistProfile(pushed); renderAll(); toast("Profile updated ✨");
  };
}
function modalEmail(current) {

function modalEmailCode(email, code, isEdit) {
  openModal(`
    <div class="mo-head"><h2>Check your inbox</h2><p>We sent a 6-digit code to <b>${esc(maskEmail(email))}</b>. It expires in 10 minutes.</p></div>
    <div class="mo-body">

        <div style="display:flex; gap:8px; justify-content:center">${[0,1,2,3,4,5].map(i =>
          `<input type="text" inputmode="numeric" maxlength="1" data-code="${i}" style="width:44px; height:52px; text-align:center; font-size:22px; font-weight:800; background:var(--rail); border:1px solid var(--border); border-radius:8px; outline:none; color:var(--text)">`).join("")}</div>
      </div>
      <div id="emCodeErr" style="display:none; color:var(--danger); font-size:13px; font-weight:600; text-align:center"></div>
      <div style="text-align:center; font-size:12.5px; color:var(--muted)">Didn't get it? <button id="emResend" style="color:#00a8fc; font-weight:700">Resend code</button> · <button id="emInbox" style="color:#00a8fc; font-weight:700">Open simulated inbox</button></div>
    </div>
    <div class="mo-foot"><button class="btn" id="emBack">Back</button><button class="btn primary" id="emVerify">Verify</button></div>`);
  const boxes = [...document.querySelectorAll("[data-code]")];
  boxes[0].focus();
  boxes.forEach((b, i) => {
    b.addEventListener("input", () => {
      b.value = b.value.replace(/\D/g, "").slice(0, 1);
      if (b.value && i < 5) boxes[i + 1].focus();
    });
    b.addEventListener("keydown", e => {
      if (e.key === "Backspace" && !b.value && i > 0) boxes[i - 1].focus();
      if (e.key === "Enter") $("#emVerify").click();
    });
    b.addEventListener("paste", e => {
      e.preventDefault();
      const digits = (e.clipboardData.getData("text").match(/\d/g) || []).slice(0, 6);
      digits.forEach((d, j) => { if (boxes[j]) boxes[j].value = d; });
      boxes[Math.min(digits.length, 5)].focus();
    });
  });
  const err = msg => { const el = $("#emCodeErr"); el.textContent = msg; el.style.display = "block"; };
  const verify = () => {
    const entered = boxes.map(b => b.value).join("");
    const v = loadVerifs()[currentUser];
    if (!v || v.email !== email) return err("No pending verification — go back and resend.");
    if (Date.now() > v.expires) return err("That code expired — resend a new one.");
    if (entered !== v.code) return err("Wrong code — check the digits and try again.");
    const users = loadUsers();
    users[currentUser].email = email;
    users[currentUser].emailVerified = true;
    saveUsers(users);
    const verifs = loadVerifs();
    delete verifs[currentUser];
    saveVerifs(verifs);
    closeModal();
    renderSettingsPane();
    toast("Email verified ✓");
  };
  $("#emVerify").onclick = verify;
  $("#emBack").onclick = () => modalEmail(users_currentEmail());
  $("#emInbox").onclick = () => {
    const inbox = (JSON.parse(localStorage.getItem("disglobe.inbox.v1") || "{}"))[email] || [];
    const last = inbox[inbox.length - 1];
    openModal(`
      <div class="mo-head"><h2>📬 Simulated inbox</h2><p>A real deployment mails this; locally billybob the mail bot delivers it here.</p></div>
      <div class="mo-body" style="text-align:left">
        ${last ? `<div style="background:var(--rail); border:1px solid var(--border); border-radius:10px; padding:14px">
          <div style="font-size:12px; color:var(--muted)">From: <b style="color:var(--text)">${esc(last.from)}</b></div>
          <div style="font-weight:700; margin:4px 0">${esc(last.subject)}</div>
          <div style="white-space:pre-wrap; font-size:14px; color:var(--text); line-height:1.5">${esc(last.body)}</div>
          <button class="btn primary" id="emUseCode" style="margin-top:12px">Use this code</button>
        </div>` : `<p style="color:var(--muted)">No mail from billybob yet — hit Resend.</p>`}
      </div>
      <div class="mo-foot"><button class="btn" id="emInboxBack">Back</button></div>`);
    $("#emInboxBack").onclick = () => modalEmailCode(email, code, isEdit);
    const use = $("#emUseCode");
    if (use) use.onclick = () => {
      modalEmailCode(email, code, isEdit);
      const v = loadVerifs()[currentUser];
      [...document.querySelectorAll("[data-code]")].forEach((b, i) => b.value = v.code[i]);
    };
  };
  $("#emResend").onclick = () => {
    const c = makeVerificationCode();
    sendVerificationEmail(email, c);
    err("");
    toast(`New code sent to ${maskEmail(email)}`);
  };
}
