        <div class="mo-foot"><button class="btn" id="asCancel">Cancel</button><button class="btn primary" id="asSave">Save</button></div>`);
      $("#asCancel").onclick = closeModal;
      $("#asSave").onclick = () => {
        rank.members = [...document.querySelectorAll("[data-who]:checked")].map(c => c.dataset.who);
        closeModal(); save(); renderSrvPane(); toast(`"${rank.name}" updated`);
      };
    });
    pane.querySelector("#rnAdd").onclick = () => {
      const name = pane.querySelector("#rnName").value.trim();
      if (!name) return toast("Give the rank a name");
      s.ranks.push({ id: uid(), name, color: pane.querySelector("#rnColor").value, members: [] });
      save(); renderSrvPane(); toast(`Rank "${name}" created 🏷️`);
    };
  } else if (srvOpenPane === "perms") {
    s.ranks ||= [];
    const chans = s.categories.flatMap(c => c.channels).filter(ch => ch.type === "text");
    const PERMS = [
      ["view", "👀 View channel"],
      ["send", "💬 Send messages"],
      ["react", "❤️ Add reactions"],
      ["attach", "📎 Attach files"],
    ];
    pane.innerHTML = `
      <h1>Rank Permissions</h1>
      <p style="color:var(--muted); max-width:520px; line-height:1.5">Choose what each rank can do per channel. Every rank has all permissions until you restrict them here — a channel with any restriction only allows ranks that are checked.</p>
      <div style="max-width:640px; margin-top:10px; overflow-x:auto">
        <table style="border-collapse:collapse; min-width:560px">
          <tr style="text-align:left">
            <th style="padding:8px 10px; color:var(--muted); font-size:12px; text-transform:uppercase">Channel</th>
            ${s.ranks.map(r => `<th style="padding:8px 10px"><span class="rank-chip" style="background:${r.color}22; color:${r.color}"><span class="rank-dot" style="background:${r.color}"></span>${esc(r.name)}</span></th>`).join("")}
          </tr>
          ${chans.map(ch => `
            <tr style="border-top:1px solid var(--border)">
              <td style="padding:9px 10px; font-weight:700"># ${esc(ch.name)}</td>
              ${s.ranks.map(r => {
                const p = (ch.perms || {})[r.id] || {};
                return `<td style="padding:9px 10px; text-align:center">
                  <div style="display:flex; flex-direction:column; gap:3px; align-items:center">
                    ${PERMS.map(([pk, pl]) => `<label title="${pl}" style="cursor:pointer; display:flex; gap:4px; align-items:center; font-size:10.5px; color:var(--muted)">
                      <input type="checkbox" data-perm="${ch.id}|${r.id}|${pk}" ${p[pk] !== false ? "checked" : ""} style="accent-color:var(--accent); width:13px; height:13px">
                    </label>`).join("")}
                  </div>
                </td>`;
              }).join("")}
            </tr>`).join("")}
        </table>
      </div>
      <div class="f-note" style="margin-top:12px">Columns: ${PERMS.map(([, l]) => l.split(" ")[0]).join(" · ")} in that order (view, send, react, attach).</div>`;
    pane.querySelectorAll("[data-perm]").forEach(cb => cb.addEventListener("change", () => {
      const [chId, rankId, pk] = cb.dataset.perm.split("|");
      const ch = chans.find(c => c.id === chId);
      if (!ch) return;
      ch.perms ||= {};
      ch.perms[rankId] = { ...(ch.perms[rankId] || {}), [pk]: cb.checked };
      save();
    }));
  } else if (srvOpenPane === "bots") {
    pane.innerHTML = `
      <h1>Bots</h1>
      <p style="color:var(--muted); max-width:460px; line-height:1.5">Create bots and add them to this server. Bots sit in the member list and can hold ranks.</p>
      <button class="btn primary" id="botCreate" style="margin:14px 0">＋ Create a Bot</button>
      <div style="max-width:520px">
        ${db.bots.length ? db.bots.map(bo => `
          <div class="rank-row">
            <span class="mini-av" style="background:${bo.color}; color:#fff; font-weight:800">${initials(bo.name)}</span>
            <span class="rr-name">${esc(bo.name)} ${bo.inServer === srvSettingsId ? `<span class="mem-tag" style="color:var(--green)">in server</span>` : `<span class="mem-tag">not added</span>`}</span>
            ${bo.inServer === srvSettingsId
              ? `<button class="set-edit-btn" data-botrm="${bo.id}">Remove</button>`
              : `<button class="set-edit-btn" data-botadd="${bo.id}" style="background:var(--accent); color:#fff; border:none">Add to Server</button>`}
          </div>`).join("") : `<p style="color:var(--faint)">No bots yet — create your first one!</p>`}
      </div>`;
    pane.querySelector("#botCreate").onclick = () => modalCreateBot(srvSettingsId);
    pane.querySelectorAll("[data-botadd]").forEach(b => b.onclick = () => {
      const bo = db.bots.find(x => x.id === b.dataset.botadd);
      bo.inServer = srvSettingsId;
      if (!s.botIds) s.botIds = [];
      s.botIds.push(bo.id);
      save(); renderAll(); renderSrvPane(); toast(`${bo.name} joined the server 🤖`);
    });
    pane.querySelectorAll("[data-botrm]").forEach(b => b.onclick = () => {
      const bo = db.bots.find(x => x.id === b.dataset.botrm);
      bo.inServer = null;
      s.botIds = (s.botIds || []).filter(x => x !== bo.id);
      save(); renderAll(); renderSrvPane(); toast(`${bo.name} removed`);
    });
  } else if (srvOpenPane === "invites") {
    pane.innerHTML = `
      <h1>Invites</h1>
      <p style="color:var(--muted); max-width:460px; line-height:1.5">Send your friend this <b>exact code</b> — they enter it under ＋ → Join a Server to join. It also works as a link.</p>
      <div style="max-width:520px; margin-top:16px; background:var(--card); border:1px solid var(--border); border-radius:10px; padding:16px">
        <div style="font-size:13px; color:var(--muted); margin-bottom:8px">Invite code</div>
        <div style="font-family:ui-monospace,monospace; font-size:22px; letter-spacing:.08em; font-weight:700; color:var(--text)" id="ivLink">Generating…</div>
        <div style="display:flex; gap:8px; margin-top:12px">
          <button class="btn primary" id="ivCopy">Copy Code</button>
          <button class="btn" id="ivCopyLink">Copy as Link</button>
        </div>
      </div>`;
    makeInvite(s).then(link => {
      const code = link ? link.split("/join/")[1] : null;
      pane.querySelector("#ivLink").textContent = code || "Couldn't create invite";
      pane.querySelector("#ivCopy").onclick = () => code && copyText(code, "Invite code copied — send it to your friend!");
      pane.querySelector("#ivCopyLink").onclick = () => link && copyText(link, "Invite link copied!");
    });
  }
}

function modalAddFriend() {
  openModal(`
    <div class="mo-head"><h2>Add Friend</h2><p>Enter your friend's <b>@username</b> — the lowercase name they registered with (shown on their profile, e.g. @qz). Display names won't always work.</p></div>
    <div class="mo-body">

    <div class="mo-foot"><button class="btn" id="afCancel">Cancel</button><button class="btn primary" id="afGo">Send Friend Request</button></div>`);

    const name = $("#afName").value.trim().toLowerCase();
    if (!name) return $("#afErr").textContent = "Type a username first.";

function modalCreateChannel(catId) {
  const s = server(db.ui.serverId);
  openModal(`
    <div class="mo-head"><h2>Create Channel</h2><p>In ${esc(s.name)}</p></div>
    <div class="mo-body">
      <div class="seg" id="ncType"><button data-t="text" class="on">💬 Text</button><button data-t="voice">🔊 Voice</button></div>
      <div class="field"><label>Channel name</label><input type="text" id="ncName" placeholder="new-channel"></div>
    </div>
    <div class="mo-foot"><button class="btn" id="ncCancel">Cancel</button><button class="btn primary" id="ncGo">Create Channel</button></div>`);
  let type = "text";
  $("#ncType").addEventListener("click", e => {
    const b = e.target.closest("button"); if (!b) return;
    type = b.dataset.t;
    [...$("#ncType").children].forEach(x => x.classList.toggle("on", x === b));
  });
  $("#ncCancel").onclick = closeModal;
  $("#ncGo").onclick = () => {
    let name = $("#ncName").value.trim().toLowerCase().replace(/[^a-z0-9-]+/g, "-").replace(/^-+|-+$/g, "") || "new-channel";
    const cat = s.categories.find(c => c.id === catId) || s.categories.find(c => c.name.includes("Text")) || s.categories[0];
    let final = name, i = 2;
    while (cat.channels.some(c => c.name === final)) final = `${name}-${i++}`;
    const chan = { id: "ch" + uid(), name: final, type, topic: "" };
    cat.channels.push(chan);
    closeModal(); save();
    if (type === "text") openChannel(s.id, chan.id);
    else renderAll();
    toast(`Created ${type === "voice" ? "🔊" : "#"}${final}`);
  };
  $("#ncName").focus();
}

function modalSettings() {
  const colors = ["#2dd4a8", "#38bdf8", "#a78bfa", "#f472b6", "#f59e0b", "#f87171", "#facc15", "#94a3b8"];
  const u = db.user;
  openModal(`
    <div class="mo-head"><h2>Settings</h2><p>Signed in as <b>${esc(currentUser)}</b> — on this device only.</p></div>
    <div class="mo-body">
      <div class="field"><label>Profile preview</label>
        <div class="set-banner" id="stBannerPrev" style="${mediaUrls.banner ? `background-image:url(${mediaUrls.banner})` : `background:${esc(u.color)}33`}"></div>
        <div class="set-row">
          <span class="set-av" id="stAvPrev">${mediaUrls.avatar ? `<img src="${mediaUrls.avatar}" alt="">` : esc(initials(displayName(u)))}</span>
          <div style="flex:1;min-width:0">
            <div style="font-weight:800">${esc(displayName(u) || "—")} <span id="stPrevGif" style="font-size:10px;color:var(--warn)"></span></div>
            <div style="font-size:12px;color:var(--muted)">${esc(u.pronouns || "\u00a0")}</div>
          </div>
          <input type="file" id="stAvFile" accept="image/*" style="display:none">
          <input type="file" id="stBannerFile" accept="image/*" style="display:none">
          <button class="btn" id="stAvBtn">📷 Avatar</button>
          <button class="btn" id="stBannerBtn">🖼️ Banner</button>
          <button class="btn" id="stAvClear" title="Remove avatar">✕</button>
          <button class="btn" id="stBannerClear" title="Remove banner">✕</button>
        </div>
        <div class="f-note">PNG, JPG, WebP or <b>animated GIF</b>. GIFs stay animated — up to ${fmtSize(MAX_FILE)} per image; statics are auto-resized.</div>
      </div>
      <div class="field"><label>Display name</label><input type="text" id="stName" value="${esc(u.displayName || "")}" placeholder="${esc(u.name)}" maxlength="32"></div>
      <div class="field"><label>Pronouns</label><input type="text" id="stPronouns" value="${esc(u.pronouns || "")}" placeholder="he/him, she/her, they/them…" maxlength="40"></div>
      <div class="field"><label>Custom status</label><input type="text" id="stCustom" value="${esc(u.customStatus || "")}" placeholder="What's happening?" maxlength="80"></div>
      <div class="field"><label>About me</label><textarea id="stBio" maxlength="200" placeholder="A little something about you…">${esc(u.bio || "")}</textarea></div>
      <div class="field"><label>Avatar fallback color</label><div class="swatches" id="stColors">${colors.map(c => `<button data-c="${c}" style="background:${c}" class="${u.color === c ? "on" : ""}"></button>`).join("")}</div></div>
      <div class="field"><label>Account</label>
        <button class="btn danger" id="stLogout">${I("logout")} Log out</button>
        <div class="f-note">Your servers and messages stay saved. Log back in anytime.</div>
      </div>
      <div class="field"><label>Danger zone</label><button class="btn danger" id="stReset" style="color:var(--danger);border-color:var(--danger)">Reset all Disglobe data</button></div>
    </div>
    <div class="mo-foot"><button class="btn" id="stCancel">Close</button><button class="btn primary" id="stSave">Save</button></div>`);

  let color = u.color;
  let draft = { avatar: undefined, banner: undefined }; // undefined = unchanged, null = cleared, object = staged
  const gifTag = () => {
    const bits = [];
    if (draft.avatar && draft.avatar.animated) bits.push("avatar GIF ✓");
    if (draft.banner && draft.banner.animated) bits.push("banner GIF ✓");
    $("#stPrevGif").textContent = bits.join(" · ");
  };
  gifTag();
  const curUrl = slot => draft[slot] === undefined ? mediaUrls[slot] : (draft[slot] ? draft[slot].url : null);
  const paint = () => {
    const bu = curUrl("banner"), au = curUrl("avatar");
    $("#stBannerPrev").style.backgroundImage = bu ? `url(${bu})` : "none";
    $("#stBannerPrev").style.backgroundColor = bu ? "transparent" : color + "33";
    $("#stAvPrev").innerHTML = au ? `<img src="${au}" alt="">` : esc(initials($("#stName").value.trim() || u.name));
    gifTag();
  };
  $("#stColors").addEventListener("click", e => {
    const b = e.target.closest("button"); if (!b) return;
    color = b.dataset.c;
    [...$("#stColors").children].forEach(x => x.classList.toggle("on", x === b));
    paint();
  });
  $("#stName").addEventListener("input", paint);
  $("#stAvBtn").onclick = () => $("#stAvFile").click();
  $("#stBannerBtn").onclick = () => $("#stBannerFile").click();
  $("#stAvFile").onchange = async e => {
    const f = e.target.files[0]; e.target.value = ""; if (!f) return;
    try { draft.avatar = await processProfileMedia(f, "avatar"); paint(); toast("Avatar staged — hit Save"); }
    catch (err) { toast(err.message); }
  };
  $("#stBannerFile").onchange = async e => {
    const f = e.target.files[0]; e.target.value = ""; if (!f) return;
    try { draft.banner = await processProfileMedia(f, "banner"); paint(); toast("Banner staged — hit Save"); }
    catch (err) { toast(err.message); }
  };
  $("#stAvClear").onclick = () => { draft.avatar = null; paint(); };
  $("#stBannerClear").onclick = () => { draft.banner = null; paint(); };
  $("#stCancel").onclick = closeModal;
  $("#stLogout").onclick = () => { closeModal(); logout(); };
  $("#stReset").onclick = () => modalConfirm("Reset everything?", "All accounts, servers, messages and attachments on this device will be wiped. This cannot be undone.", async () => {
    try { const keys = await IDB.keys(); for (const k of keys) await IDB.del(k); } catch {}
    const users = loadUsers();
    for (const uu of Object.keys(users)) localStorage.removeItem(worldKey(uu));
    localStorage.removeItem(USERS_KEY);
    localStorage.removeItem(SESSION_KEY);
    location.reload();
  });
  $("#stSave").onclick = async () => {
    u.displayName = $("#stName").value.trim();
    u.pronouns = $("#stPronouns").value.trim();
    u.customStatus = $("#stCustom").value.trim();
    u.bio = $("#stBio").value.trim();
    u.color = color;
    const pushed = [];
    for (const slot of ["avatar", "banner"]) {
      const d = draft[slot];
      if (d === null) { // cleared
        try { await IDB.del(`pf:${currentUser}:${slot}`); } catch {}
        if (mediaUrls[slot]) { URL.revokeObjectURL(mediaUrls[slot]); mediaUrls[slot] = null; }
        u[slot] = null;
        pushed.push(slot);
      } else if (d && d.blob) { // newly staged
        try { await IDB.put(`pf:${currentUser}:${slot}`, d.blob); }
        catch { toast("Couldn't store the image (storage full?)"); continue; }
        if (mediaUrls[slot]) URL.revokeObjectURL(mediaUrls[slot]);
        mediaUrls[slot] = d.url;
        u[slot] = { name: d.name, size: d.size, animated: d.animated };
        pushed.push(slot);
      }
    }
    closeModal(); save(); persistProfile(pushed); renderAll(); toast("Profile updated ✨");
  };
  $("#stName").focus();
}

function modalConfirm(title, body, onYes) {
  openModal(`
    <div class="mo-head"><h2>${esc(title)}</h2><p>${esc(body)}</p></div>
    <div class="mo-foot"><button class="btn" id="cfNo">Cancel</button><button class="btn primary" id="cfYes" style="background:var(--danger)">Confirm</button></div>`);
  $("#cfNo").onclick = closeModal;
  $("#cfYes").onclick = () => { closeModal(); onYes(); };
}

/* popover */
const popover = $("#popover");
function showPopover(x, y, html) {
  popover.innerHTML = html; popover.classList.add("show");
  const r = popover.getBoundingClientRect();
  popover.style.left = Math.min(x, innerWidth - r.width - 8) + "px";
  popover.style.top = Math.min(y, innerHeight - r.height - 8) + "px";
}
function hidePopover() { popover.classList.remove("show"); }

/* emoji picker */
const emojiPicker = $("#emojiPicker");
const EMOJIS = ["😀","😅","😂","🥲","😍","🤔","😴","🥳","😎","🤖","😭","😡","👍","👎","👀","🙌","👏","🙏","💪","🫡","🔥","✨","🎉","❤️","🧡","💛","💚","💙","💜","🌐","☕","🍕","🎮","🎧","🚀","🌙","⭐","💾","📌","💀","🫠","🤝","🧠","🍿","🐟","⚡","🌈","🪐"];
let emojiMode = null; // {type:'react', msgId} | {type:'composer'}
function openEmojiPicker(x, y, mode) {
  emojiMode = mode;
  emojiPicker.innerHTML = `<div class="emoji-grid">${EMOJIS.map(e => `<button data-e="${e}">${e}</button>`).join("")}</div>`;
  emojiPicker.classList.add("show");
  const r = emojiPicker.getBoundingClientRect();
  emojiPicker.style.left = Math.max(8, Math.min(x - r.width / 2, innerWidth - r.width - 8)) + "px";
  emojiPicker.style.top = Math.max(8, Math.min(y - r.height, innerHeight - r.height - 8)) + "px";
}
function hideEmojiPicker() { emojiPicker.classList.remove("show"); emojiMode = null; }
emojiPicker.addEventListener("click", e => {
  const b = e.target.closest("button[data-e]"); if (!b || !emojiMode) return;
  const emoji = b.dataset.e;
  if (emojiMode.type === "react") toggleReaction(emojiMode.msgId, emoji);
  else if (emojiMode.type === "composer") {
    const inp = $("#composerInput");
    inp.value += emoji; inp.focus();
  }
  hideEmojiPicker();
});
function toggleReaction(msgId, emoji) {
  const list = db.msgs[chanKey()] || [];
  const m = list.find(x => x.id === msgId); if (!m) return;
  if (db.ui.view === "server" && !rankAllows(curChan(), "react")) return toast("Your rank can't react in this channel 🔒");
  m.reactions ||= {};
  const users = m.reactions[emoji] ||= [];
  const i = users.indexOf("me");
  i >= 0 ? users.splice(i, 1) : users.push("me");
  if (!users.length) delete m.reactions[emoji];
  save(); renderMain();
}

/* ================= search ================= */
let searchOpen = false;
function runSearch(q) {
  const box = $("#searchResults"); if (!box) return;
  q = q.trim().toLowerCase();
  if (!q) { box.classList.remove("show"); searchOpen = false; return; }
  const hits = (db.msgs[chanKey()] || []).filter(m => (m.text || "").toLowerCase().includes(q)).slice(-30);
  searchOpen = true;
  const rx = new RegExp("(" + q.replace(/[.*+?^${}()|[\]\\]/g, "\\$&") + ")", "ig");
  box.innerHTML = `<div class="sr-head">Messages in this chat — ${hits.length}</div>` + (hits.map(m => {
    const a = member(m.uid);
    return `<div class="sr-item" data-jump="${m.id}"><div class="sr-from" style="color:${esc(a.color)}">${esc(a.name)} <span style="color:var(--faint);font-weight:400">${fmtTime(m.ts)}</span></div><div class="sr-text">${esc(m.text || "").replace(rx, "<mark>$1</mark>")}</div></div>`;
  }).join("") || `<div class="sr-head">No results</div>`);
  box.classList.add("show");
}
function jumpToMessage(id) {
  const el = document.querySelector(`.msg[data-msg="${id}"]`);
  if (el) { el.scrollIntoView({ block: "center" }); el.classList.remove("flash"); void el.offsetWidth; el.classList.add("flash"); }
  $("#searchResults").classList.remove("show"); searchOpen = false;
  const si = $("#searchInput"); if (si) si.value = "";
}

function openReportModal(m, key) {
  const author = member(m.uid);
  const REASONS = [
    ["spam", "Spam or phishing", "Unwanted promos, scams, fake links"],
    ["harassment", "Harassment or bullying", "Targeting someone to hurt or shame"],
    ["hate", "Hate speech", "Attacks based on identity"],
    ["sexual", "Sexual content", "Not safe for this server"],
    ["violence", "Violence or threats", "Threatening harm to people or property"],
    ["illegal", "Illegal activity", "Anything that breaks the law"],
    ["other", "Something else", "Anything not covered above"],
  ];
  openModal(`
    <div class="mo-head"><h2>Report message</h2><p>Let the server moderators know what's wrong. Reports are anonymous — ${esc(displayName(author))} won't be told who reported it.</p></div>
    <div class="mo-body">
      <div style="background:var(--hover);border-radius:8px;padding:10px 12px;margin-bottom:14px;font-size:13.5px;color:var(--muted)">
        <b style="color:var(--text)">${esc(displayName(author))}</b> · ${new Date(m.ts).toLocaleString()}<br>${esc((m.text || "(attachment)").slice(0, 160))}
      </div>
      <div id="reportReasons">
        ${REASONS.map(([id, label, sub]) => `<button class="rr" data-r="${id}"><b>${label}</b><span>${sub}</span></button>`).join("")}
      </div>
      <div class="field" id="reportDetailsWrap" style="display:none"><label>Add details (optional)</label><input type="text" id="reportDetails" maxlength="300" placeholder="Anything the moderators should know"></div>
      <div id="reportDone" style="display:none;text-align:center;padding:18px 0">
        <div style="font-size:34px">✅</div>
        <h3 style="margin:8px 0 4px">Report sent</h3>
        <p style="color:var(--muted);font-size:13px">Thanks for keeping Disglobe safe. Moderators will take a look.</p>
      </div>
    </div>
    <div class="mo-foot"><button class="btn" id="rpCancel">Cancel</button><button class="btn primary" id="rpSend" style="display:none;background:var(--danger)">Submit Report</button></div>`);
  let reason = null;
  $("#rpCancel").onclick = closeModal;
  $("#reportReasons").addEventListener("click", e => {
    const b = e.target.closest(".rr"); if (!b) return;
    reason = b.dataset.r;
    [...$("#reportReasons").children].forEach(x => x.style.outline = x === b ? "2px solid var(--accent)" : "");
    $("#reportDetailsWrap").style.display = "";
    $("#rpSend").style.display = "";
  });
  $("#rpSend").onclick = async () => {
    try {
      await api("/api/report", { body: { key, msgId: m.id, reason, details: ($("#reportDetails").value || "").trim() } });
      $("#reportReasons").style.display = "none";
      $("#reportDetailsWrap").style.display = "none";
      $("#rpSend").style.display = "none";
      $("#rpCancel").textContent = "Close";
      $("#reportDone").style.display = "";
    } catch (err) { toast(err.message); }
  };
}

  const watchBtn = e.target.closest("[data-watch]");
  if (watchBtn) {
    const peer = watchBtn.dataset.watch;
    const stream = rtcIncoming.get(peer);
    if (!stream) return toast("Their stream isn't connected yet");
    const m = member(peer);
    const st = (db.voiceStates || {})[peer] || {};
    $("#svName").textContent = displayName(m);
    $("#svStats").textContent = `${st.sharing === "cam" ? "Camera" : "Screen"} · ${st.quality || "720:30"}`;
    $("#svQuality").style.display = "none"; /* not my capture: can't switch their quality */
    $("#svStop").textContent = "Close";
    $("#svVideo").srcObject = stream;
    $("#streamView").classList.add("show");
    return;
  }
  /* call bar */
  if (e.target.closest("#cbMute")) {
    db.ui.mute = !db.ui.mute; save(); renderSidebar();
    if (window.__call.micStream) window.__call.micStream.getAudioTracks().forEach(t => t.enabled = !db.ui.mute);
    toast(db.ui.mute ? "🎙️ Muted" : "🎙️ Unmuted");
    return;
  }
  if (e.target.closest("#cbDeaf")) {
    db.ui.deaf = !db.ui.deaf;
    if (db.ui.deaf) { db.ui.mute = true; if (window.__call.micStream) window.__call.micStream.getAudioTracks().forEach(t => t.enabled = false); }
    else if (window.__call.micStream) window.__call.micStream.getAudioTracks().forEach(t => t.enabled = true);
    remoteAudios.forEach((a, n) => setRemoteVolume(n));
    save(); renderSidebar();
    toast(db.ui.deaf ? "🎧 Deafened" : "🎧 Undeafened");
    return;
  }
  if (e.target.closest("#cbCam")) return toggleCam();
  if (e.target.closest("#cbShare")) return startShare();
  if (e.target.closest("#cbHangup")) {
    callDisconnectAll();
    db.ui.voice = null; save(); renderSidebar(); renderRail();
    announceVoice({ leave: true });
    dropAllPeers();
    toast("📞 Disconnected");
    return;
  }
  if (e.target.closest("#btnDisconnect")) {
    callDisconnectAll();
    db.ui.voice = null; save(); renderSidebar(); renderRail();
    announceVoice({ leave: true });
    dropAllPeers();
    return;
  }
});

/* ================= auth screen wiring ================= */
$("#authLogo").innerHTML = I("globe");
let authMode = "login";
function setAuthMode(mode) {
  authMode = mode;
  $("#tabLogin").classList.toggle("on", mode === "login");
  $("#tabSignup").classList.toggle("on", mode === "signup");
  $("#authGo").textContent = mode === "login" ? "Log In" : "Create Account & Enter";
  $("#authEmailWrap").style.display = mode === "signup" ? "" : "none";

  authError(null);
}$( "#tabLogin" ).onclick = () => setAuthMode("login");

$( "#authPass" ).addEventListener("keydown", e => { if (e.key === "Enter") $( "#authGo" ).click(); });
$( "#authUser" ).addEventListener("keydown", e => { if (e.key === "Enter") $( "#authPass" ).focus(); });

/* ================= remote server (cloud) ================= */
function authServerLabel() {
  try { const u = new URL(API.base); return u.hostname + (u.port ? ":" + u.port : ""); } catch { return API.base; }
}
(function wireServerPicker() {
  const nameEl = $("#authServerName");
  if (nameEl) nameEl.textContent = "Server: " + authServerLabel();
  const btn = $("#authChangeServer");
  if (!btn) return;
  btn.onclick = () => {
    const box = $("#authServerBox");
    const open = box.style.display === "none";
    box.style.display = open ? "" : "none";
    if (open) { $("#authServerUrl").value = savedServerUrl() || ""; $("#authServerMsg").textContent = ""; $("#authServerUrl").focus(); }
  };
  $("#authServerSave").onclick = () => {
    const msg = $("#authServerMsg");
    let v = $("#authServerUrl").value.trim();
    if (!v) { localStorage.removeItem("disglobe.server"); API.base = defaultServerUrl(); msg.style.color = "#3ba55c"; msg.textContent = "Using this device's own server."; updateServerLabel(); return; }
    if (!/^https?:\/\//i.test(v)) v = "https://" + v;
    msg.style.color = "#4e5058"; msg.textContent = "Checking…";
    fetch(v.replace(/\/$/, "") + "/api/ping", { method: "GET" }).then(r => r.json()).then(d => {
      if (!d.disglobe) throw new Error("bad");
      API.base = v.replace(/\/$/, "");
      localStorage.setItem("disglobe.server", API.base);
      msg.style.color = "#3ba55c";
      msg.textContent = `✓ Connected! ${d.users} user(s), ${d.servers} server(s). Log in below.`;
      updateServerLabel();
    }).catch(() => { msg.style.color = "#d83c3e"; msg.textContent = "Couldn't reach a Disglobe server there — check the address."; });
  };
  function updateServerLabel() { const n = $("#authServerName"); if (n) n.textContent = "Server: " + authServerLabel(); }
})();

/* ================= forgot password =================
   Step 1: username + email + new password → billybob emails a 6-digit code.
   Step 2: enter the code → password is changed, sessions are revoked. */
$( "#authForgot" ).onclick = () => {
  openModal(`
    <div class="mo-head"><h2>Reset your password</h2><p>Enter your username, the email on the account, and a new password. billybob will email you a 6-digit code to confirm it's you.</p></div>
    <div class="mo-body">
      <div class="field"><label>Username</label><input type="text" id="fpUser" maxlength="20" autocomplete="off"></div>
      <div class="field"><label>Email on the account</label><input type="email" id="fpEmail" maxlength="80" autocomplete="off"></div>
      <div class="field"><label>New password</label><input type="password" id="fpPass" maxlength="64" autocomplete="new-password" placeholder="at least 4 characters"></div>
      <div id="fpErr" style="color:var(--danger);font-size:13px;min-height:18px;white-space:pre-line"></div>
    </div>
    <div class="mo-foot"><button class="btn" id="fpCancel">Cancel</button><button class="btn primary" id="fpGo">Email me a code</button></div>`);
  $("#fpCancel").onclick = closeModal;
  $("#fpUser").focus();
  $("#fpPass").addEventListener("keydown", e => { if (e.key === "Enter") $("#fpGo").click(); });
  $("#fpGo").onclick = async () => {
    const name = $("#fpUser").value.trim().toLowerCase();
    const email = $("#fpEmail").value.trim().toLowerCase();
    const newPass = $("#fpPass").value;
    if (!name || !email) return $("#fpErr").textContent = "Fill in your username and email.";
    if (newPass.length < 4) return $("#fpErr").textContent = "New password needs at least 4 characters.";
    $("#fpErr").textContent = "";
    try {
      const r = await api("/api/reset/start", { body: { name, email } });
      resetStep2(name, newPass, r.email);
    } catch (e) { $("#fpErr").textContent = e.message; }
  };
};

function resetStep2(name, newPass, maskedEmail) {
  openModal(`
    <div class="mo-head"><h2>Check your email 📬</h2><p>billybob mailed a 6-digit code to <b>${esc(maskedEmail)}</b>. It expires in 10 minutes.</p></div>
    <div class="mo-body">
      <div class="otp-row" id="fpOtp">${Array.from({ length: 6 }, (_, i) => `<input type="text" inputmode="numeric" maxlength="1" data-i="${i}" autocomplete="one-time-code">`).join("")}</div>
      <div id="fpErr2" style="color:var(--danger);font-size:13px;min-height:18px;text-align:center"></div>
    </div>
    <div class="mo-foot"><button class="btn" id="fpBack">Back</button><button class="btn primary" id="fpDone">Reset Password</button></div>`);
  const boxes = [...document.querySelectorAll("#fpOtp input")];
  const val = () => boxes.map(b => b.value).join("");
  boxes[0].focus();
  boxes.forEach((b, i) => {
    b.addEventListener("input", () => { b.value = b.value.replace(/\D/g, "").slice(0, 1); if (b.value && i < 5) boxes[i + 1].focus(); });
    b.addEventListener("keydown", e => { if (e.key === "Backspace" && !b.value && i > 0) boxes[i - 1].focus(); });
  });
  document.querySelector("#fpOtp").addEventListener("paste", e => {
    const digits = (e.clipboardData.getData("text") || "").replace(/\D/g, "").slice(0, 6);
    if (!digits) return;
    e.preventDefault();
    digits.split("").forEach((d, i) => boxes[i] && (boxes[i].value = d));
    boxes[Math.min(digits.length, 5)].focus();
  });
  $("#fpBack").onclick = () => $("#authForgot").click();
  $("#fpDone").onclick = async () => {
    if (val().length < 6) return $("#fpErr2").textContent = "Enter all 6 digits.";
    try {
      await api("/api/reset/complete", { body: { name, code: val(), newPass } });
      closeModal();
      $("#authUser").value = name;
      $("#authPass").value = "";
      authError(null);
      toast("Password reset ✅ — log in with your new password");
    } catch (e) { $("#fpErr2").textContent = e.message; }
  };
}
