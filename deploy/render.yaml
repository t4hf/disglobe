services:
  - type: web
    name: disglobe
    runtime: node
    plan: free
    rootDir: deploy
    buildCommand: "npm install --omit=dev"
    startCommand: "node server.js"
    healthCheckPath: /api/ping
    envVars:
      - key: NODE_VERSION
        value: "20"
      - key: DATABASE_URL
        fromDatabase:
          name: disglobe-db
          property: connectionString

databases:
  - name: disglobe-db
    plan: free
    databaseName: disglobe
    user: disglobe
    ipAllowList: []
